<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build your profile – Tuitionwing</title>
<meta name="description" content="Answer a short adaptive questionnaire. Your answers become the profile our agent uses to find scholarships you qualify for.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="../landing/index.html" aria-label="Tuitionwing home"><span class="logo-mark"><i class="ph-fill ph-bird"></i></span><span class="logo-word">Tuitionwing</span></a>
    <ol class="steps" id="steps" aria-label="Progress"></ol>
    <div class="top-right">
      <span class="pill" id="pill" hidden><i class="ph-fill ph-target"></i><b id="pillCount">0</b> awards</span>
      <span class="saved" id="saved" aria-live="polite"></span>
      <button class="link-btn" id="reset" type="button">Start over</button>
    </div>
  </div>
</header>

<main class="shell">
  <section class="stage">
    <div class="card" id="card"></div>
  </section>

  <aside class="panel" id="panel" aria-label="Your profile so far">
    <div class="panel-head">
      <span class="live"><span class="dot"></span>Your profile</span>
      <span class="mono" id="answerCount">0 answers</span>
    </div>
    <div class="count-wrap" id="countWrap" hidden>
      <div class="result-top" aria-live="polite">
        <div class="count" id="count">0</div>
        <span>awards you could apply for</span>
      </div>
      <span class="delta" id="delta" aria-hidden="true"></span>
    </div>
    <div class="bucket" id="bucket" hidden>
      <i class="ph-fill ph-medal"></i>
      <span><b id="bucketCount">0</b> service-commitment awards in their own list</span>
    </div>
    <p class="panel-note" id="panelNote"></p>
    <div class="tags" id="tags"></div>
    <p class="panel-fine" id="panelFine" hidden>Preview estimate. Real counts come from the search agent.</p>
  </aside>
</main>

<noscript><p style="padding:24px">This questionnaire needs JavaScript to run.</p></noscript>

<script src="data.js"></script>
<script src="schema.js"></script>
<script src="avatar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
