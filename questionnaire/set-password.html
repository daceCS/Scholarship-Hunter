<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a password – Tuitionwing</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="/" aria-label="Tuitionwing home"><span class="logo-mark"><i class="ph-fill ph-bird"></i></span><span class="logo-word">Tuitionwing</span></a>
  </div>
</header>

<main class="shell" style="grid-template-columns:minmax(0,640px);justify-content:center">
  <section class="stage"><div class="card" id="card"></div></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
// Landing page for both the invitation email and the password-reset email: the link carries a one-time session.
const card = document.getElementById('card');
const recovery = /type=recovery/.test(location.hash);   // read before the Supabase client clears the hash
const mk = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

(async () => {
  const s = await TW.auth.session();
  if (!s) {
    card.replaceChildren(mk('div', { className: 'screen' },
      mk('h1', {}, 'This link has expired.'),
      mk('p', { className: 'lede' }, 'Links work once and only for a short time. Go to sign in and choose "Forgot password?" to get a new one.'),
      mk('div', { className: 'actions' }, mk('a', { className: 'btn btn-primary', href: '/questionnaire/' }, 'Go to sign in'))));
    return;
  }
  const pw = mk('input', { className: 'input', type: 'password', minLength: 8, autocomplete: 'new-password', placeholder: 'New password (8+ characters)' });
  pw.setAttribute('aria-label', 'New password');
  const msg = mk('p', { className: 'fine' }); msg.setAttribute('role', 'status');
  const go = mk('button', { className: 'btn btn-primary', type: 'button' }, 'Save password');
  go.onclick = async () => {
    if (pw.value.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; return; }
    go.disabled = true; msg.textContent = 'Saving...';
    try { await TW.auth.setPassword(pw.value); location.href = recovery ? '/dashboard/' : '/questionnaire/'; }
    catch (e) { go.disabled = false; msg.textContent = e.message; }
  };
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
  card.replaceChildren(mk('div', { className: 'screen' },
    mk('h1', {}, recovery ? 'Choose a new password.' : 'Welcome. Choose a password.'),
    mk('p', { className: 'lede' }, recovery ? 'Then you will go straight to your matches.' : 'Then you can take the questionnaire and see your matches.'),
    mk('div', { className: 'auth-form' }, pw, msg, mk('div', { className: 'actions' }, mk('span', { className: 'grow' }), go))));
  pw.focus();
})();
</script>
</body>
</html>
