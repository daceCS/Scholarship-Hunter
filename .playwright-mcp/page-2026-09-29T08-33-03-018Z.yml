          - generic [ref=e690]: "Alan Turing Memorial Scholarship Endowment Fund - UC San Diego Scholarships Skip to Navigation Skip to Content Sign In (https://ucsd.academicworks.com/users/sign_in) Opportunities (https://ucsd.academicworks.com/opportunities)Scholarship Ours (https://ucsd.academicworks.com/opportunities) Other External (https://ucsd.academicworks.com/opportunities/external) Alan Turing Memorial Scholarship Endowment Fund ELIGIBILITY: Computer Science, Computer or Electrical Engineering, Communications, or Political Science/Public Policy majors, and other programs touching on networked systems, who can describe in their application how they are connected to the LGBTQIA+ community* and are actively advocating for LGBTQIA+ issues. Preference is given to students with demonstrated academic merit, academic involvement and financial need. CONFIDENTIALITY The answers you provide in the Opportunity Specific Question section are confidential – only the LGBTQIA+ Scholarship Committee can view your responses. Other committees are blocked from viewing this section. If awarded this scholarship, we will ask you to provide a statement about how you have contributed to the visibility and advocacy of the LGBTQIA+ community. How does your activism connect to your academic goals and contribute to your area of study? Your name and this statement will be released to the public if you provide us with your consent. *All eligible students are encouraged to apply. The Alan Turing Memorial Scholarships do not consider race, color, national origin, religion, sex, disability, and/or other protected categories as part of the application and selection process. Award Up to $12,000 Anticipated Total Anticipated total amount over the full term of this award. $12,000.00 Deadline 04/02/2026 Supplemental Questions Alan Turing was a brilliant mathematician and cryptanalyst who co-founded the field of computer science. During World War II, Turing devised the techniques that led to breaking codes produced by Germany’s Enigma machine—a breakthrough that accelerated the Allied victory by more than a year. After the war, he was persecuted for being gay. He took his life in 1954. The Alan Turing Memorial Scholarship was created to encourage a more diverse and inclusive community of engineers and to honor the memory of Alan Turing. Please describe how you have contributed to the visibility and advocacy of the LGBTQIA+ community. How does your activism connect to your academic goals and contributions to your area of study? One or two-sentence submissions will not be considered. More information about the scholarship can be found here: https://cns.ucsd.edu/?p=3750. © 2026 Blackbaud, Inc. All rights reserved. Home (http://ucsd.edu/)"
