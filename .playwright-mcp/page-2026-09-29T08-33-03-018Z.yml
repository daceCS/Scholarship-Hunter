          - generic [ref=e354]: "LGBT Scholarships | PFLAG San Diego County | 888 398-0006 Skip to content Find a Support Group (https://pflagsdc.org/support-meetings/) Info Line (619) 333-6154 (tel:16193336154) Find a Support Group (https://pflagsdc.org/support-meetings/) Info Line (619) 333-6154 (tel:16193336154) Toggle NavigationSupport & ResourcesPFLAG SDC Support Groups (https://pflagsdc.org/support-meetings/) PFLAG SDC Downloads (https://pflagsdc.org/downloads/) LGBTQ+ Resources (https://pflagsdc.org/lgbtq-resources/) LGBTQ+ Reading List (https://pflagsdc.org/lgbtq-reading-list/) Education (https://pflagsdc.org/education/) Advocacy (https://pflagsdc.org/advocacy/) ScholarshipsAbout the Scholarships (https://pflagsdc.org/scholarships/) Apply for Scholarships (https://pflagsdc.org/scholarship-applicants/) Support our Students (https://pflagsdc.org/support-our-students/) Scholarship Luncheon Sponsorship and Tickets (https://pflagsdc.org/scholarship-luncheon/) Scholarship Recipients (https://pflagsdc.org/previous-winners/) Join & GiveBecome a Member (https://pflagsdc.org/membership/) Make a Donation (https://pflagsdc.org/donate/) Volunteer (https://pflagsdc.org/volunteer/) AboutVision & Mission (https://pflagsdc.org/about/) Board of Directors (https://pflagsdc.org/board-of-directors/) Contact (https://pflagsdc.org/contact/) Toggle NavigationSupport & ResourcesPFLAG SDC Support Groups (https://pflagsdc.org/support-meetings/) PFLAG SDC Downloads (https://pflagsdc.org/downloads/) LGBTQ+ Resources (https://pflagsdc.org/lgbtq-resources/) LGBTQ+ Reading List (https://pflagsdc.org/lgbtq-reading-list/) Education (https://pflagsdc.org/education/) Advocacy (https://pflagsdc.org/advocacy/) ScholarshipsAbout the Scholarships (https://pflagsdc.org/scholarships/) Apply for Scholarships (https://pflagsdc.org/scholarship-applicants/) Support our Students (https://pflagsdc.org/support-our-students/) Scholarship Luncheon Sponsorship and Tickets (https://pflagsdc.org/scholarship-luncheon/) Scholarship Recipients (https://pflagsdc.org/previous-winners/) Join & GiveBecome a Member (https://pflagsdc.org/membership/) Make a Donation (https://pflagsdc.org/donate/) Volunteer (https://pflagsdc.org/volunteer/) AboutVision & Mission (https://pflagsdc.org/about/) Board of Directors (https://pflagsdc.org/board-of-directors/) Contact (https://pflagsdc.org/contact/) About the ScholarshipsPFLAG San Diego County (https://pflagsdc.org/author/adm1n/)2026-08-01T12:00:33-07:00 About the Scholarships (https://pflagsdc.org/scholarships/) Apply for Scholarships (https://pflagsdc.org/scholarship-applicants/) Support Our Students (https://pflagsdc.org/support-our-students/) Luncheon Sponsorship (https://pflagsdc.org/scholarship-luncheon/) Scholarship Recipients (https://pflagsdc.org/previous-winners/) The PFLAG San Diego County Scholarship Portfolio Since 1998, PFLAG San Diego County has overseen the awarding of close to 300 scholarships, totaling over $600,000 to LGBTQ+ students. The portfolio of scholarship awards overseen by the PFLAG SDC Scholarship Committee continues to increase, including scholarships funded through PFLAG SDC members: Bowersox Family, Terrie Vorono/Lonnie Brunini, Charles S. Kaminski, Trischman Family, Tom Schaide, Russ Fox, Madruga Family, Dave Adams/Tom Hammond, and Ted Callam. The scholarships are awarded to LGBTQ+ high school seniors continuing to higher education or full-time undergraduate and graduate students at an accredited institution. In addition to general scholarships, some are offered for specific areas of study: STEM, Fine and Applied Arts, Education, Health Services, Community College, and Vocational Studies. The scholarship committee selects recipients through a competitive application and essay process that is based on commitment to their chosen field, financial need, and academic achievement. Our Mission: To create a caring, just, and affirming world for LGBTQ+ people and those who love them. PFLAG San Diego County and its collaborators are pleased to offer these scholarships. The minimum scholarship amount is $2,000, and more than one scholarship may be awarded in a given category. Applicants are encouraged to address the additional award factors considered for these named scholarships when submitting their essays. Scholarship Descriptions Mary Wagner Memorial Scholarship (est. 1999) Mary’s lifelong friends, Marilyn and Art Carpenter, have contributed annually to the scholarship to honor Mary’s memory and enduring commitment to education. John Bessemer Memorial Scholarship (est. 2002) This scholarship is sponsored by the PFLAG San Diego County Scholarship Fund. It was established to honor the memory of John Bessemer, a PFLAG Dad who was committed to LGBTQ+ youth. John, whose passion was education, was the husband of Linda Bessemer, a past president. Rob Benzon Memorial Scholarship (est. 2006) To honor their beloved and generous friend, Rob Benzon, the Rob Benzon Foundation Scholarship was created to recognize youth who demonstrate a giving spirit and charisma. Stephen G. Bowersox Memorial Scholarship (est. 2008) This scholarship was established through the generosity of family, friends, and co-workers of Jim and Donna Bowersox. The Bowersox family has sustained the scholarship through the years. Their son, Stephen, was the recipient of a 2003 scholarship. This award is strongly predicated on social justice, demonstrated involvement, and high academic achievement, as well as broad, far-reaching interests and activities. Kendall Family Memorial Scholarship (est. 2017) Dr. Kendall was an elementary education professor for 30 years at San Diego State University and was a lifelong student himself. Joanna Kendall was a dedicated real estate agent. They believed in the power of every individual to have an impact in their community. It was Dr. & Mrs. Kendall who introduced their daughter, Terrie Vorono, to PFLAG SDC over 20 years ago. Terrie is a past president of PFLAG San Diego County and is indebted to PFLAG SDC for the opportunity to enrich her life working with LGBTQ+ new friends and allies. M. Lynne Austin Memorial Scholarship (est. 2019) Ray and Jan Aller established the scholarship in memory of Rev. Martha Lynne Austin, a senior pastor of the United Methodist Church. Lynne was a life-long teacher who championed inclusiveness, tolerance, and grace. Daniel J. Ferbal Memorial Scholarship (est. 2020) Dan was a founding member of the Rob Benzon Foundation, and this scholarship was created in his honor. He was not only a leader in the Foundation, but in the hotel industry, as well. He was enthusiastic toward life, caring, and had a great sense of humor. Gary A. Marcus Scholarship for the Fine and Applied Arts (est. 2021) This scholarship is open to students who are continuing their education in the fine and applied arts to include art programs, theatre, literature, and music as well as cinema, television or digital arts/animation. Mr. Marcus has a BFA and an MFA from the Maryland Institute College of Art. In his long, professional career, he taught art classes full time at a community college and at a junior high school, was an Interior Designer, and a Facilities Project Manager for the Federal Government. Bill Hanson Community College Scholarships (est. 2021) These scholarships are principally, but not exclusively, for those students who feel their career choices will be better met at a community college or recognized vocational program. The goal of these scholarships is to either prepare students for employment in current or emerging occupations or establish a strong foundation for further studies. Personal Achievement Scholarships (est. 2021) Through the generosity of an anonymous donor, PFLAG SDC is offering Personal Achievement Scholarships. These scholarships are intended for LGBTQ+ individuals who have overcome barriers to academic success, including First Generation applicants, English as a second language, those impacted by illness or other life challenges, or returning mature students. Applicants must attend or plan to attend an accredited college, university, or recognized vocational program. Jeffrey D. Shorn and Charles S. Kaminski Scholarships (est. 2023) Funded by Charles Kaminski in loving memory of his husband, Jeffrey Shorn, two scholarships are being awarded. One scholarship is to encourage global thinking and one to support architecture or similar vocations. Jeffrey and Charles met in New York in 1974 and moved to San Diego in 1975. Being an out couple for almost 47 years, they were loving partners and husbands, architects, educators, and historians. Trischman Family Scholarship (est. 2024) The Trischman family embraces the values of acceptance, honesty, curiosity, and generosity. The Trischman Family Scholarship supports those seeking an education that will enable them to contribute to their community and the world around them. The scholarship is open to LGBTQ+ students pursuing a bachelor’s degree in Music or Science with an emphasis on biology or the environment. Don Wahl Memorial Scholarship (est. 2024) The family of Don Wahl established this scholarship to remember and honor him. His son, Joseph, was able to advance his education through academic scholarships. This scholarship intends to provide a similar opportunity for a high-achieving student. The award has a strong emphasis on educational background, attention to detail, and community engagement in remembrance of the many wonderful characteristics of Don Wahl. Tom Schaide and Russell Fox Scholarships (est. 2024) These scholarships were established through the generosity of Tom Schaide and Russell Fox. The successful applicants are pursuing a career in healthcare with an emphasis on treating our underserved LGBTQ+ community. Madruga Family Scholarship (est. 2025) The Madruga Family Scholarship is for students pursuing higher education in the arts, including fine arts, music, or dance. With an aim to encourage students to achieve a Master of Fine Arts, this scholarship includes emphasis in creative writing, design, filmmaking, performing arts, visual arts, music, graphic design, screenwriting, theater, and digital cinema production. Undergraduates will be considered in addition to graduate students. Andy Thomas Memorial Scholarship (est. 2025) Andy was a long-time board member of the Rob Benzon/Dan Ferbal Foundation. He was a big supporter of the arts and served on the La Jolla Playhouse board for many years. This scholarship is open to students who are pursuing a theater degree. OUTbio San Diego Next Generation Innovator Scholarship (est. 2025) The OUTbio San Diego Next Generation Innovator Scholarship recognizes an outstanding LGBTQ+ student pursuing a STEM education/career in the life sciences. The 2027 award is made possible through the generous support of Travere Therapeutics and their Employee Resource Group, VOICE. The ideal applicant will demonstrate academic promise, leadership potential, and a commitment to community, particularly in support of LGBTQ+ or scientific communities. Tyler Christenson Memorial Scholarship (est. 2025) The Tyler Christenson Memorial Scholarship remembers the enthusiasm that Tyler brought to his entrepreneurial businesses. This scholarship is designed for someone with a passion for business and marketing. The ideal candidate should demonstrate an awareness of the greater community and an ability to overcome personal challenges. Applicants may be pursuing either a vocational or academic program. Dave Adams and Tom Hammond Scholarship (est. 2026) Dave and Tom want to encourage our next generation of leaders who will work to create positive change towards a more inclusive world of opportunity for all. They especially want to support those applicants who are overcoming challenges such as learning disabilities, financial insecurity, lack of supportive resources, or other barriers in their personal lives and are using that resilience to help others. Dan and Ted Gadawski Callam Scholarships (est. 2026) In honor of his late husband Dan, these scholarships celebrate LGBTQ+ students who lead with courage, passion, and heart. It supports those pursuing higher education while creating inclusive, equitable communities and advocating for equity, social justice, and positive change. Recipients are recognized not only for academic achievement, but for integrity and authentic engagement. By investing in emerging leaders, these scholarships continue Dan and Ted’s legacy of support for fostering a future where LGBTQ+ voices are not only seen and heard, but also celebrated, respected, and equipped to make meaningful impacts in the world. James Ziegler and PFLAG San Diego County Fund STEM Scholarship (est. 2026) This STEM scholarship is awarded to an outstanding individual pursuing a career in science, technology, engineering, or math. George Vickrey and Robert Lerner Scholarships (est. 2026) Robert Lerner established these scholarships in loving memory of his husband, George Vickrey. Mr. Vickrey, who was not only an attorney, but also had a degree in piano performance. One scholarship will be awarded to a student studying in the broad field of legal or legal-related issues, which could include immigration assistance or civil rights. The other scholarship is to be awarded to a student studying music, either instrumental or voice, or in the field of fine and applied arts, with a career path that could lead to performance, teaching, or an industry related to music. For deadlines and applications, visit the Scholarship Application page (https://pflagsdc.org/scholarship-applicants/). If you have questions, please email us (mailto:scholarships@pflag.com). Ask Questions (mailto:scholarships@pflagsdc.org) Apply for Scholarships (https://pflagsdc.org/scholarship-applicants/) Contact PFLAG San Diego County, a 501(c)(3) non-profit organization. Mailing Address: PFLAG San Diego County P.O. Box 82762 San Diego, CA 92138 Donate (https://pflagsdc.org/donate/) Become a Member (https://pflagsdc.org/membership/) Get Email Updates Get PFLAG SDC updates, events, and LGBTQ+ news in your inbox. \"*\" indicates required fields Email This field is for validation purposes and should be left unchanged. Email* Subscribe Δ Need Help? Support Groups (https://pflagsdc.org/support-meetings/) Call the Info Line: (619) 333-6154 (tel:6193336154) LGBTQ+ Resources (https://pflagsdc.org/lgbtq-resources/) © PFLAG San Diego County, a 501(c)(3) non-profit organization Federal tax ID number 33-0512868 Privacy Policy (https://pflagsdc.org/privacy-policy/) | Terms of Service (https://pflagsdc.org/terms-of-service/) | Cookie Policy (https://pflagsdc.org/cookie-policy/) | Data Access Request (https://pflagsdc.org/data-access-request/) Do Not Sell or Share My Personal Information Designed by Belladia Marketing and Design (https://belladiadesign.com/) Page load link Go to Top"
