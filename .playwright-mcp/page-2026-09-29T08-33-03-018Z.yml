          - generic [ref=e426]: "STEM Committee - San Diego Rotary Skip to content Will Hage President 2026-27 HOME (https://sandiegorotary.club/) Programs (https://sandiegorotary.club/event-calendar/) Membership (https://sandiegorotary.club/membership/) Committees (https://sandiegorotary.club/committees/) Member Center (https://sandiegorotary.club/#membercenter) The Rotator (https://sandiegorotary.club/rotator/) About Us (https://sandiegorotary.club/about-us/) HOME (https://sandiegorotary.club/) Programs (https://sandiegorotary.club/event-calendar/) Membership (https://sandiegorotary.club/membership/) Committees (https://sandiegorotary.club/committees/) Member Center (https://sandiegorotary.club/#membercenter) The Rotator (https://sandiegorotary.club/rotator/) About Us (https://sandiegorotary.club/about-us/) Back to Committees (https://sandiegorotary.club/committees/) STEM Committee Terry Caskey Co-chair Doug Arbon Co-chair Purpose: In the midst of the COVID-19 Pandemic the future seems fluid and opaque, but our future as a species will be guided by STEM. And not just for this Pandemic, but for looming opportunities and challenges provided by Climate Change, Artificial Intelligence, DNA manipulations, and Explorations of our Solar System. For the past few decades, our schools have not been producing enough STEM oriented students to fill the demands of Hi Tech Companies. So these companies have filled the void by hiring foreign born college graduates – and we have benefited immensely from this cultural and technological infusion (TESLA, GOOGLE, etc.). But a STEM Education is not just an integral part of our Economy; it is a key component of Civil Rights and Gender Equality. It provides access to the first rung of the financial ladder to success, and is why Rotary needs to be involved. One of the major Rotary supported STEM activities is Robotics. After observing a nascent autonomous robotics program at Hoover HS and Wilson Middle School, we invited the Hoover Cluster of 10 Elementary Schools to participate in the Autonomous Robotics program called Junior Botball, and watched it catch on fire. We provided the funding for the Botball Robotics units, and provided the learning resources for reticent Teachers. This is a Teacher Driven Program. We’ve evolved to having STEM Committed Teachers whom we call “School Champions” (but whom we should call “Heroes”), and encourage them with stipends to defray expenses. Why Join: We look upon ourselves as Catalysts or Facilitators for STEM. And we do not have preconceived ideas about where we’re going! So, if you might be interested in anything to do with STEM, or just might want to see students deeply enmeshed in profound thinking, pondering “what the heck went wrong with my coding of the robot”, or see the exuberant “Hi Fives” after seeing their robots complete a “Challenge”, a “Challenging Course or Task”, drop by to see the future generation in action at one of our “Botball Challenges” (for the Elementary students) or “Botball Competitions” (for the Middle and High School students). We welcome any suggestions or leads that you think might be helpful to us. And you are invited to come and be transformed, like the students themselves, as they become involved in the Rotary STEM activities. Here is a recent video that illuminates some of our impact ... STEM Overview (https://vimeo.com/349969319) The Club also supports STEM through the CADES Scholarship. More information can be found here (https://sandiegorotary.club/committees/cades-scholarship/) Posts navigation ← RYLA – Rotary Youth Leadership Awards (https://sandiegorotary.club/committees/ryla-rotary-youth-leadership-awards/) San Diego State Rotaracts → (https://sandiegorotary.club/committees/rotaract/) Get In Touch! 1-619-299-3309 office phone 1-619-299-3340 FAX 2247 San Diego Avenue Suite 233 San Diego, CA 92110-2943 Send Email (https://sandiegorotary.club/contact/) About Rotary The Object of Rotary is to encourage and foster the ideal of service as a basis of worthy enterprise and, in particular, to encourage and foster: FIRST: The development of acquaintance as an opportunity for service; SECOND: High ethical standards in business and professions; the recognition of the worthiness of all useful occupations; and the dignifying of each Rotarian’s occupation as an opportunity to serve society; THIRD: The application of the ideal of service in each Rotarian’s personal, business, and community life; FOURTH: The advancement of international understanding, goodwill, and peace through a world fellowship of business and professional persons united in the ideal of service. The Four Way Test The Four-Way Test is a nonpartisan and nonsectarian ethical guide for Rotarians to use for their personal and professional relationships. The test has been translated into more than 100 languages, and Rotarians recite it at club meetings: Of the things we think, say or do Is it the TRUTH? Is it FAIR to all concerned? Will it build GOODWILL and BETTER FRIENDSHIPS? Will it be BENEFICIAL to all concerned? Supporting Students College SDSU Rotaract https://www.sdsurotaract.org/ City Heights Rotaract https://www.cityheightsrotaract.org/ High School Hoover Interact https://cardinalsinteract.org/ Our Lady of Peace https://www.aolp.org/school-life/student-clubs Member Center Donate (https://sandiegorotary.club/about-us/foundation/) Committees (https://sandiegorotary.club/committees/) Member Directory Login (http://clubweb.sandiegorotary.club/main/dir_main.cgi?club=936) My Rotary Member Login (https://my.rotary.org/en) Member Downloads (https://sandiegorotary.club/about-us/member-information/) Donate (https://sandiegorotary.club/about-us/foundation/) Committees (https://sandiegorotary.club/committees/) Member Directory Login (http://clubweb.sandiegorotary.club/main/dir_main.cgi?club=936) My Rotary Member Login (https://my.rotary.org/en) Member Downloads (https://sandiegorotary.club/about-us/member-information/) © 2026 San Diego Rotary. All Rights Reserved. Site powered by San Diego Rotarians - Privacy (https://sandiegorotary.club/about-us/privacy/) - Contact Us (https://sandiegorotary.club/contact/)"
