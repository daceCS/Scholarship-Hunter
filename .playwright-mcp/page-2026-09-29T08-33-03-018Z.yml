l Contact (https://www.cwsl.edu/directions/contact.html) Home (https://www.cwsl.edu/) Admissions & Aid (https://www.cwsl.edu/admissions_and_aid/) Financial Aid (https://www.cwsl.edu/admissions_and_aid/financial_aid/) Aid Programs (https://www.cwsl.edu/admissions_and_aid/financial_aid/aid_programs/) External Scholarships External foundations, nonprofits, law firms, and networking groups support scholarships for students to help finance their legal education. Our financial aid team regularly receives information about these law school scholarships and is ready to help you find the best opportunities. Current External Scholarships Organizations, groups, and nonprofits occasionally contact California Western with information about scholarships their agencies offer. While this is not an exhaustive list, the following are some of the scholarships currently being offered: AccessLex Law School Scholarship Databank The AccessLex Institute® invites you to utilize their newest tool to find money that’s already available to help pay for law school and lower your student loan burdens. Search over 800 carefully curated and vetted scholarship opportunities and writing competitions, with filters to help you find the ones best suited for you. Learn more (https://www.accesslex.org/databank) HBAIE Law Student Scholarship The Hispanic Bar Association Inland Empire (HBAIE) 2026 Law Student Scholarship is offering a $2,000 scholarship to two deserving individuals with strong ties to the Inland Empire. These scholarships will be awarded based on the successful applicants’ commitment to the Hispanic community, connection to the Inland Empire, scholastic excellence, financial need, and outstanding personal qualities. The application deadline has been extended to October 2, 2026. Learn more (https://www.hbaie.com/Scholarship) SDLRLA Scholarship Program San Diego La Raza Lawyers Association (SDLRLA) Scholarship Fund proudly announces the 2026 Scholarship Program. Scholarships are awarded to 2L and 3L law school students who meet the criteria of community service, financial need, and academic achievement. Recipients are not limited to persons of a Latino/a background. Instead, the bar stipends are awarded to law students from a variety of backgrounds who have contributed to advancing the Latino/a or Spanish-speaking community and demonstrated potential to succeed. Completed applications and materials must be submitted on or before September 18, 2026, at 11:59 p.m. Learn more (https://sdlrlascholarshipfund.org/scholarships/) The Anita Hill Scholarship The Anita Hill Scholarship honors Professor Anita Hill's legacy by supporting law students who demonstrate a commitment to advancing democracy, civil rights, and gender equity. Established by a coalition of Professor Hill's former students and fiscally sponsored by StitchCrew, the scholarship provides financial support to law students whose work, life, or interests reflect Professor Hill's enduring values of integrity, courage, and public service. Five $10,000 scholarships will be distributed. Deadline to apply is September 22, 2026. Learn more (https://www.stitchcrew.com/anita-hill-scholarship) Nancy E. O'Malley Scholarship The Nancy E. O'Malley Scholarship was founded in 2016 to honor California Women Lawyers (CWL) Past President Nancy E. O'Malley for her dedication and commitment to promoting CWL and protecting all women and children in our society. One scholarship is awarded annually to a law student whose prior and current activities, and future plans, demonstrate a commitment to issues affecting women and/or children in the community. Everyone who meets the requirements may apply. One $5,000 scholarship will be awarded. The application deadline is September 25, 2026, at 5 p.m. PST. Learn more (https://www.cwl.org/Nancy-E.OMalley-Scholarship) OC ABOTA Scholarship The Orange County Chapter of the American Board of Trial Advocates (OC ABOTA) announces their fall 2026 scholarship. Applicants must be a second- or third-year law student, reside in Orange County or be enrolled in an Orange County law school, and be in good standing at a California State Bar-accredited law school. Applicants must demonstrate legal aptitude, have a minimum 3.0 GPA from the past academic year, and submit a current transcript. The application deadline is October 6, 2026. Learn more (https://www.cwsl.edu/2026_oc_abota_scholarship.pdf) California Western is pleased to share information about scholarship opportunities offered by external organizations and/or individuals. These scholarships are administered independently by their respective sponsors and are not affiliated with, endorsed by, or administered by the school. Accordingly, California Western does not guarantee the accuracy, completeness, availability, eligibility requirements, application processes, deadlines, award amounts, or payment of any outside scholarship. Students are solely responsible for researching scholarship opportunities, verifying information with the sponsoring organization, and determining the legitimacy of any program before applying. Financial Aid Office The Financial Aid Office is here to help you navigate the financial aid process. If you require assistance or have questions about external scholarships, please contact our office. Contact Us Email JavaScript Required (https://duckduckgo.com/?q=what+is+email+obfuscation%3F) Phone (619) 525-7060 (tel:6195257060) Location 225 Cedar St. San Diego, CA 92101 Back to Top Join Us Apply (https://os.lsac.org/Release/Logon/Access.aspx)Visit (https://www.cwsl.edu/admissions_and_aid/schedule_a_visit.html)Get Info (https://www.cwsl.edu/admissions_and_aid/get_info.html) facebook (https://www.facebook.com/californiawestern) instagram (http://instagram.com/californiawesternschooloflaw) linkedin (https://www.linkedin.com/school/27755/) youtube (http://www.youtube.com/californiawestern) 225 Cedar St. San Diego, CA 92101 (619) 239-0391 (tel:6192390391) JavaScript Required (https://duckduckgo.com/?q=what+is+email+obfuscation%3F) Consumer Information (ABA Required Disclosures) (https://www.cwsl.edu/about/required_disclosures/consumer_information_aba_required_disclosures/index.html) Privacy Policy (https://www.cwsl.edu/about/legal/privacy_policy.html) Cookie Preferences (https://www.cwsl.edu/about/legal/#cookie_preferences) © California Western School of Law. All rights reserved. © (https://a.cms.omniupdate.com/11/?skin=oucampus&account=cwsl&site=www&action=de&path=/admissions_and_aid/financial_aid/aid_programs/scholarships/external_scholarships.pcf)"
