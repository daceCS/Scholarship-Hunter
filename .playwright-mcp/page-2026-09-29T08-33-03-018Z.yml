:19:28+00:00 Empowering Future Leaders The Downtown San Diego Lions Club is dedicated to fostering the next generation of community leaders. Through its Welfare Foundation, the club proudly offers scholarships to support local high school students who are committed to serving their communities while pursuing higher education. Who Is Eligible? The Downtown San Diego Lions Club scholarship is available to graduating seniors from the following high schools within the club’s geographical area: Hoover High School Garfield High School Kearny High School Lincoln High School Monarch High School Twain High School Gompers High School San Diego High School What Does the Scholarship Cover? Each scholarship recipient will receive $2,000 to assist in their educational journey. The scholarship can be applied toward tuition or other educational expenses at any community college or vocational school of the student’s choice. Selection Criteria The Downtown San Diego Lions Club aims to support students who demonstrate a commitment to making a positive impact in their communities. Scholarships are awarded based on the following: Merit: Applicants should showcase their academic achievements and potential for future success. Financial Need: Scholarships are designed to support those who may face financial challenges in accessing higher education. Community Service: A strong emphasis is placed on individuals who have actively served their communities and show a continued commitment to doing so. How to Apply Students interested in applying for the scholarship must complete the following steps: Obtain an Application: Applications are available through school counselors starting in early February. Submit Necessary Documents: This includes the application form, a financial data form, and high school transcripts. Write an Essay: Applicants must write an essay explaining why they deserve the scholarship. The essay should highlight community service, including family-related activities, civic engagements, and participation in extracurricular activities like sports, music, or church groups. Requirements for Applicants Applicants must be U.S. citizens or legal residents with an alien registration card. Applicants must submit all documents and the essay by the designated deadline. By supporting this scholarship, the Downtown San Diego Lions Club continues its legacy of uplifting students who are passionate about education and community service. If you’re a high school senior eager to make a difference, this scholarship could be your stepping stone to success! YOUTH SCHOLARSHIP AWARD The San Diego Lion’s Club is noted for its generosity in serving our communities, however the Youth Activities Committee saw an opportunity to enhance the image as well as promote the Lion’s Club creed of community service. This committee proposed a scholarship award based heavily on youth community service. While financial need and a sufficient grade point average must be demonstrated, community service, aligned with the Lion’s Club’s general objectives is the bulk of the criteria which are: To encourage service-minded men and women to serve their community without personal financial reward to encourage efficiency and promote high ethical standards in commerce, industry, professions, public works and private endeavors. To create and foster a spirit of understanding among the peoples of the world. To take an active interest in the civic, cultural, social and moral welfare of the community. To unite the clubs in the bonds of friendship, good fellowship and mutual understanding. To provide a forum for the open discussion of all matters of public interest; provided, however, that partisan politics, and sectarian religion shall not be debated by club members. We are very proud of our accomplishments thus far and look forward to many years of providing scholarships to deserving young people. Mission & MembershipMission & Membership (https://sandiegolions.org/membership/) Shaping a Compassionate Future. Join our mission to transform the world one person at a time. Through dedicated programs that foster empathy, fellowship, and service, we are cultivating a community of compassion and activism. Resources. Club History (https://sandiegolions.org/history/) Grant Forms (https://sandiegolions.org/grant-forms/) Tax Information (https://sandiegolions.org/tax-information/) Club Events (https://sandiegolions.org/events/) get in touch. (619) 239-7264 (tel:(619) 239-7264) sdlionsclub@gmail.com 310 Market Street San Diego, CA 92101 © - 2026 • Downtown San Diego Lions Club • All Rights Reserved • Privacy Policy (https://sandiegolions.org/privacy-policy/) Page load link site navigation. Home (https://sandiegolions.org/) Membership (https://sandiegolions.org/membership/)Leadership (https://sandiegolions.org/membership/#leadership) Club History (https://sandiegolions.org/history/) Testimonials (https://sandiegolions.org/testimonials/) Community Service (https://sandiegolions.org/community-service/)Lions ProjectsScholarship Fund (https://sandiegolions.org/community-service/downtown-san-diego-lions-club-scholarship-fund/) Lions Camp Jack (https://sandiegolions.org/community-service/lions-camp-jack/) High School Baseball Tournament (https://sandiegolions.org/community-service/lions-invitational-high-school-baseball-tourney/) Affiliated OrganizationsOptometric Vision Clinic (https://sandiegolions.org/community-service/lions-optometric-vision-clinic/) Boys and Girls Foundation (https://sandiegolions.org/community-service/boys-and-girls-foundation/) Deaf Community Services (https://sandiegolions.org/community-service/hearing-impaired/) Funded Non-ProfitsOutdoor Outreach (https://sandiegolions.org/community-service/outdoor-outreach/) San Diego Rescue Mission (https://sandiegolions.org/community-service/san-diego-rescue-mission/) Melvin Jones Award (https://sandiegolions.org/community-service/the-melvin-jones-fellowship-award/) Lions Manor (https://sandiegolions.org/lions-community-manor/) Aid & Grants (https://sandiegolions.org/resources/)Grant Forms (https://sandiegolions.org/grant-forms/) Tax Information (https://sandiegolions.org/tax-information/) Welfare Foundation (https://sandiegolions.org/lions-club-welfare-foundation/) Contact Us (https://sandiegolions.org/contact/) Downtown San Diego Lions Club. Empowering Generations to Serve Through Programs with Compassion, Empathy & Activism Members Members Go to Top"
