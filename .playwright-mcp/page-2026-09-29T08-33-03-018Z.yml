er-KOR.pdf) 繁體中文 (https://www.apcf.org/s/Scholarship-Flier-Chinese.pdf) IMPACT Scholar's Majors All values are given as a percentage Ethnicity All values are given as a percentage CURRENT SCHOLARSHIP PROGRAMS APCF is excited to partner with local donors to offer scholarship programs annually to financially assist students in their pursuit of higher education. Through a competitive process, scholarship recipients are selected by a review committee based on academic merits, community involvement, leadership skills as well as recommendation from a mentor. Many of our scholarship programs are intended to support low-income youth, and several programs encourage students to study locally at a community college or state university. CURRENT SCHOLARSHIP PROGRAM PARTNERS PAST SCHOLARSHIP PROGRAM PARTNERS Asian Pacific Community Fund of Southern California 1145 Wilshire Boulevard, Los Angeles, CA, 90017, United States (213) 624-6400 (tel:(213) 624-6400) general@apcf.org (mailto:general@apcf.org) Hours Mon 10 AM - 6 PM Tue 10 AM - 6 PM Wed 10 AM - 6 PM Thu 10 AM - 6 PM Fri 10 AM - 6 PM Sat Closed Sun Closed 1145 Wilshire Blvd #105 Los Angeles, CA 90017 subscribe (http://go.pardot.com/l/1049682/2023-11-23/9sr) Built By TDMAmerica.com"
