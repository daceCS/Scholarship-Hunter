r Advisors (https://www.truman.gov/apply/advisors/notes-advisors) Advisor Application Instructions (https://www.truman.gov/apply/advisors/advisor-application-instructions) Frequently Asked Questions for Advisors (https://www.truman.gov/apply/advisors/frequently-asked-questions-advisors) For Finalists (https://www.truman.gov/apply/finalists) Regional Review Panels (https://www.truman.gov/apply/finalists/regional-review-panels) Practice Interview Questions (https://www.truman.gov/apply/finalists/practice-interview-questions) Frequently Asked Questions for Finalists (https://www.truman.gov/apply/finalists/frequently-asked-questions-finalists) Meet Our Scholars (https://www.truman.gov/meet-our-scholars) 2026 Truman Scholars (https://www.truman.gov/2026Scholars) Scholar Listing (https://www.truman.gov/meet-our-scholars/scholar-listing) Scholar Programs (https://www.truman.gov/meet-our-scholars/scholar-programs) Truman Scholars Leadership Week (https://www.truman.gov/meet-our-scholars/scholar-programs/truman-scholars-leadership-week) Summer Institute (https://www.truman.gov/meet-our-scholars/scholar-programs/summer-institute) Truman-Albright Fellows (https://www.truman.gov/meet-our-scholars/scholar-programs/truman-albright-fellows) Truman Democracy Fellows (https://www.truman.gov/meet-our-scholars/scholar-programs/truman-democracy-fellows) Truman Governance Fellows (https://www.truman.gov/meet-our-scholars/scholar-programs/truman-governance-fellows) Partner Organizations (https://www.truman.gov/meet-our-scholars/partner-organizations) Friends of the Truman Foundation & the Truman Scholars Association (https://www.truman.gov/meet-our-scholars/partner-organizations/friends-truman-foundation-truman-scholars-association) Additional Scholar Benefits (https://www.truman.gov/graduate-school-partners) Hiring Authority (https://www.truman.gov/meet-our-scholars/partner-organizations/hiring-authority) News (https://www.truman.gov/news) Contact Us (https://www.truman.gov/about-us/contact-us) Log In (https://www.truman.gov/user/login) Search Breadcrumb Home (https://www.truman.gov/) Additional Scholarship Opportunities Additional Scholarship Opportunities The listing below is a compilation of material from The National Association of Fellowships Advisors Reference Guide and individual program websites. This information is provided for reference and it is up to Scholars to contact relevant programs to verify requirements, deadlines and other program details. Awards to Study, Travel or Research Abroad ASF Fellowships and Grants to Study in Scandinavia ASF offers fellowships (up to $23,000) and grants (up to $5,000) to individuals pursuing research or creative arts projects in one or more Nordic countries (Denmark, Finland, Iceland, Norway, Sweden). Projects must be well-defined and contribute to the applicant’s academic or professional development. amscan.org/fellowships-and-grants/fellowshipsgrants-to-study-in-scandinavia/ (https://amscan.org/fellowships-and-grants/fellowshipsgrants-to-study-in-scandinavia/) Asia Foundation Development Fellows The Asia Foundation Development Fellows program is a learning program designed for highly talented individuals from Asia and the Pacific under age 40 to enhance their leadership skills, regional development knowledge, professional networks, and international exposure. The program reflects The Asia Foundation’s nearly 7-decade tradition of investing in the region’s most promising future leaders. asiafoundation.org/programs/education-and-leadership/asia-foundation-development (https://asiafoundation.org/programs/education-and-leadership/leadex/asia-foundation-development-fellows/) Banyan Impact Fellowship Fully funded program that trains, supports, and places fellows with communities in India for service projects. AIF provides professional development through mentorship, workshops, and thematic conferences throughout the program. Fellows receive a stipend, comprehensive insurance coverage, access to a private counselor, and 24/7 emergency support. AIF offers support for Fellows with disabilities who require special accommodations and/or assistive technology to participate. All program-related travel, visa support, language training, and international airfare is covered by AIF. Fellows enjoy access to a global network of 500+ Alumni. https://aif.org/fellowship/ Blakemore Freeman Fellows Since 1992 the Blakemore Foundation has been awarding fellowships for an academic year of advanced-level language study in East or Southeast Asia. Eligible languages are Chinese, Japanese, Korean, Indonesian, Khmer, Thai, and Vietnamese. Superior candidates committed to careers in academia, STEM, international business, accounting, law, medicine, journalism, architecture, teaching, social or NGO work, and government service that will require professional fluency in that modern Asian language throughout that individual's life are encouraged to apply. blakemorefoundation.org/ (https://www.blakemorefoundation.org/) Boren Fellowship Boren Scholars study a wide range of critical languages, including Arabic, Mandarin Chinese, Portuguese, Russian, and Swahili. Boren Awards are available to students of all proficiency levels who are committed to enhancing their skills. Boren Scholars from diverse fields of study immerse themselves in the cultures in world regions underrepresented in study abroad, including Africa, Asia, Eurasia, Latin America, and the Middle East. Boren Awards alumni are committed to public service, working in positions critical to U.S. national security throughout the Federal Government. borenawards.org (https://www.borenawards.org/) Chateaubriand Fellowship The Chateaubriand Fellowship in HSS supports U.S.-based PhD students conducting research in France for 4 months (Fall or Spring). The Chateaubriand Fellowship in STEM supports U.S.-based PhD students in STEM and health fields to conduct part of their doctoral research in a French laboratory, fostering academic exchange and collaboration between the U.S. and France. chateaubriand-fellowship.org/hss-application/ (https://chateaubriand-fellowship.org/hss-application/) https://chateaubriand-fellowship.org/stem-application/ Congress-Bundestag Youth Exchange for Youth (CBYX) The Congress-Bundestag Youth Exchange for Young Professionals (CBYX) is a fellowship funded by the German Bundestag and U.S. Department of State that annually provides 75 American and German young professionals the opportunity to spend one year in each other’s countries, studying, interning, and living with hosts on a cultural diplomacy and professional development program. www.cbyx.info (https://www.cbyx.info/) Critical Language Scholarship (CLS) The Critical Language Scholarship (CLS) Program provides fully funded immersive summer programs for U.S. undergraduate and graduate students to learn languages of strategic importance to the United States’ national security, economic prosperity, and engagement with the world. A program of the U.S. Department of State’s Bureau of Educational and Cultural Affairs, the CLS Program is part of a U.S. government effort to increase the number of Americans studying and mastering critical foreign languages and applying skills in their professional careers. clscholarship.org (https://clscholarship.org/) Christianson Fellowship The InterExchange Foundation Christianson Fellowship provides up to $15,000 in grant funding to support motivated young Americans who are committed to perform impactful service projects abroad. Fellows identify a project or an organization working on an issue they care about, and with the support of the Christianson Fellowship, contribute their skills and passion to that endeavor for at least six months on-location abroad. The Fellowship supports applicants who are motivated and passionate about doing good, establish clear and measurable goals for their time abroad that align with their future plans, bring specific and needed skills to the host community, and are excited to serve as an ambassador for InterExchange and the U.S. while learning about the host culture. Fellowship awards range between $2,500 and $15,000 and Christianson Fellowship application deadlines are March 15, July 15, and October 15. https://www.interexchange.org/programs/travel-experiences-for-u-s-residents/christianson-fellowship/ DAAD & DAAD RISE Research Grants Research grants for highly qualified candidates who are completing research projects 2-12 months in duration at German universities or research institutions. Research Internships in Science and Engineering (RISE) internships offer graduate (RISE Professional) in STEM fields the opportunity to complete paid summer internships at top German universities and research institutions. daad.org (https://www.daad.org/en/) https://www.daad.de/rise/en/ English Program in Korea EPIK is a government-sponsored program that places native English-speaking teachers in public schools across South Korea to improve students' English proficiency and foster cultural exchange. https://www.epik.go.kr/ Fulbright US Student Program Fulbright is the flagship international exchange program sponsored by the U.S. Department of State in partnership with over 140 countries worldwide. The Fulbright U.S. Student Program expands perspectives through academic and professional advancement and cross-cultural dialogue. Fulbright creates connections in a complex and changing world. In partnership with more than 140 countries worldwide, the Fulbright U.S. Student Program offers unparalleled opportunities in all academic and artistic disciplines to passionate and accomplished graduating college seniors, graduate students, and young professionals from all backgrounds. Program participants pursue graduate study, conduct research, or teach English abroad. Grant lengths and dates vary by country. www.us.fulbrightonline.org (https://www.us.fulbrightonline.org/) ICWA Fellowship ICWA advances deep knowledge of global cultures and affairs. We achieve that by supporting fellows for two-year immersive programs of independent research and writing abroad. icwa.org/apply (https://www.icwa.org/apply/) Japan Exchange and Teaching (JET) Program The JET Program is a competitive employment opportunity that allows professionals to live and work in cities, towns, and villages throughout Japan. Being a JET grantee is an opportunity to work and to represent the United States as cultural ambassadors to Japan. Most participants serve as Assistant Language Teachers (ALTs) and work in public and private schools throughout Japan; some work as Coordinators for International Relations (CIRs) as interpreters/translators. https://jetprogramusa.org/jet-program/ Luce Scholars Program Established in 1974, the Luce Scholars Program is a competitive leadership development fellowship that provides emerging leaders with immersive professional experiences in Asia. Each year, 15 to 18 Luce Scholars are selected for a 13-month experience living and working in Asia. Scholars are placed in full-time professional roles that reflect their interests and expertise. They receive support through a program stipend, language training, and cultural orientation. Placements span a wide range of sectors, including public health, environmental science, journalism, education, the arts, technology, law and more. https://lucescholars.org/ Princeton in Africa Fellowship Princeton in Africa (PiAf) is a non-profit organization that offers a yearlong paid post-graduate fellowship opportunities to graduates of US-accredited colleges & universities with a variety of organizations across the African continent. Since its launch in 1999, PiAf has placed more than 750 Fellows in 105 host organizations and 37 countries across the continent. PiAf Fellows work in many different sectors, including international humanitarian aid, public & community health, business & economic development, agricultural development, and education & youth capacity building. Many of their fellowship organizations are also led by social entrepreneurs. Fellows gain valuable professional experience through roles within the organizations including Communications, Research, Business Development, Financial Analysis, Grant Writing, Program Management and Monitoring and Evaluation. https://www.princetoninafrica.org/ Princeton in Asia Princeton in Asia Fellowships foster mutual appreciation and cross-cultural understanding between the United States and Asia through immersive work fellowships in host organizations and communities. PiA fellowships span a variety of focus areas, including arts and culture, economic development, education, environmental sustainability, peace, justice, and access to information, public health, sports, and STEM. Princeton in Asia (PiA) believes in the power of person-to-person diplomacy. We strive to shape a world where individuals share a mutual appreciation and respect for our planet’s diversity of cultures and perspectives. https://www.princetoninasia.org/ Princeton in Latin America Fellowship The PiLA Fellowship offers recent graduates the opportunity to work with nonprofit and public service organizations across Latin America and the Caribbean. Fellows engage in projects spanning education, public health, environmental conservation, microfinance, and more, contributing to meaningful development work in the region. https://pila-princeton.org/ Quad Fellowship The Quad Fellowship supports 100 exceptional American, Japanese, Australian, and Indian master's and doctoral students in science, technology, engineering, and mathematics (STEM) to study in the United States. The fellowship develops a network of science and technology experts committed to advancing innovation and collaboration in the private, public, and academic sectors, in their own nations and among Quad countries. quadfellowship.org (https://www.quadfellowship.org/) Watson Fellowship The Thomas J. Watson Fellowship is a one-year grant for purposeful, independent exploration outside the United States, awarded to graduating seniors nominated by one of 41 partner institutions. https://watson.foundation/ Degree-Granting Programs Abroad Churchill Scholarship The Churchill Scholarship is for one year of Master's study in science, math, or engineering at the University of Cambridge. It was established as part of the founding of Churchill College as a predominantly science and technology college and the National and Commonwealth memorial to Sir Winston Churchill. It fulfills his vision of deepening the US–UK partnership in order to advance science and technology, ensuring our future prosperity and security. Many Churchill Scholars describe their year in Cambridge as the best year of their lives. What makes the experience so exceptional is the unique opportunity to focus on independent research, the welcoming and non-hierarchical culture of Cambridge labs, the emphasis on work-life balance, and the rich environment for personal growth that Cambridge provides. www.churchillscholarship.org (https://www.churchillscholarship.org/) DAAD Study Scholarships – Master Studies for All Academic Disciplines Highly qualified final year undergraduate students or those who have received an undergraduate degree of all disciplines may apply for the DAAD Study Scholarship for a full master’s degree program at a State or State-recognized university in Germany or for study at a German university as part of a postgraduate or master’s degree program completed in the home country. daad.org (https://www.daad.org/en/) Ellison Scholars The Ellison Scholars programme empowers exceptional individuals to become global technology innovators and leaders of the future, solving humanity’s most challenging and enduring problems. The programme provides full funding for undergraduate or graduate studies at the University of Oxford, covering course fees, a generous living stipend and the equivalent of paid internships. Alongside their Oxford education, Scholars engage in project-based learning and receive mentorship with world-renowned experts at EIT, preparing them to drive profound change in their home countries and around the world. https://www.eit.org/scholars Fulbright US Student Program Fulbright is the flagship international exchange program sponsored by the U.S. Department of State in partnership with over 140 countries worldwide. The Fulbright U.S. Student Program expands perspectives through academic and professional advancement and cross-cultural dialogue. Fulbright creates connections in a complex and changing world. In partnership with more than 140 countries worldwide, the Fulbright U.S. Student Program offers unparalleled opportunities in all academic and artistic disciplines to passionate and accomplished graduating college seniors, graduate students, and young professionals from all backgrounds. Program participants pursue graduate study, conduct research, or teach English abroad. Grant lengths and dates vary by country. www.us.fulbrightonline.org (https://www.us.fulbrightonline.org/) Gates Cambridge Scholarship The Gates Cambridge mission is to build a global network of future leaders committed to improving the lives of others. It aims to achieve this mission by selecting outstanding scholars, providing them with financial and non-financial support at one of the world’s leading universities and facilitating community building at and beyond Cambridge. Each year Gates Cambridge offers c.75 full-cost scholarships to outstanding applicants from countries outside the UK to pursue a range of postgraduate degrees at the University of Cambridge. Approximately two-thirds of these awards will be offered to PhD students, with c.20 awards available in the US selection round and 55 available in the International selection round. There are at least 225 Scholars from c. 50 countries studying in Cambridge at any one time, spread across its departments and Colleges. www.gatescambridge.org (https://www.gatescambridge.org/) The Lafayette Fellowship Open to both Francophone and non-Francophone candidates, the initiative will partner with top French higher education institutions that offer programs across STEM, the humanities, social sciences, and the arts, either in French or entirely in English. In addition to their academic studies, fellows will take part in the French-American Leadership Program, a dynamic, year-long experience featuring lectures, masterclasses, site visits, and mentorship support, offering a 360-degree immersion into European innovation, culture, and policy. https://villa-albertine.org/va/news/announcing-the-lafayette-fellowship-a-new-opportunity-for-graduate-studies-in-france-for-tomorrows-leaders/ Marshall Scholarship Marshall Scholarships finance young Americans of high ability to study for a degree in the United Kingdom. Up to fifty Scholars are selected each year to study at graduate level at an UK institution in any field of study. As future leaders, with a lasting understanding of British society, Marshall Scholars strengthen the enduring relationship between the British and American peoples, their governments and their institutions. Marshall Scholars are talented, independent and wide-ranging, and their time as Scholars enhances their intellectual and personal growth. Their direct engagement with Britain through its best academic programmes contributes to their ultimate personal success. https://www.marshallscholarship.org/ Marshall Sherfield Fellowship The aim of the Marshall Sherfield Fellowships is to introduce American scientists and engineers to the cutting edge of UK science and engineering. It is intended that this in turn will build longer-term contacts and international links between the United Kingdom and the United States in key scientific areas. The wider objectives are similar to those of the Marshall Scholarships programme. https://www.marshallscholarship.org/marshall-sherfield McCall MacBain Scholarship Full scholarships with mentorship and leadership skills development opportunities for students interested in applying to master’s and professional studies at McGill University. McCall MacBain scholarships can be used fund over 150+ eligible master’s programs and three professional programs (law, dentistry, medicine). We offer 30 full scholarships and 100 other awards ($5,000 to $20,000 CAD) to students for the following year’s admission. https://mccallmacbainscholars.org/ Rhodes Scholarship The Rhodes Scholarships are international postgraduate awards for students to study at the University of Oxford. Rhodes Scholars are young leaders of outstanding intellect and character who are motivated to engage with global challenges, committed to the service of others, and show promise of becoming value-driven, principled leaders for the world’s future. https://www.rhodeshouse.ox.ac.uk/scholarships/the-rhodes-scholarship/ Schwarzman Scholars Schwarzman Scholars is a fully funded, one-year master’s degree program in global affairs at Schwarzman College, Tsinghua University in Beijing, China. An unparalleled graduate and leadership development program, the experience encompasses unique opportunities in and outside the classroom, providing Scholars with extensive leadership training, a network of senior mentors, opportunities to engage in high-level interactions with Chinese leaders and visiting speakers, optional internships, career development guidance, and travel seminars around China. Schwarzman Scholars’ dynamic curriculum — based on the pillars of China, leadership, and global affairs — is designed to provide Scholars with the knowledge, skills, and firsthand experience needed to navigate the complexities of the evolving global landscape. https://www.schwarzmanscholars.org/ Other Funding for Graduate School CMU Rales Fellows Program The Carnegie Mellon University Rales Fellows Program is dedicated to cultivating the next generation of STEM leaders and driving innovation by increasing access to a life-changing graduate education. By removing financial barriers to obtaining advanced degrees and providing Fellows with holistic support, the Rales Fellows Program empowers and connects scholars with others who share a passion for progress and innovation. The program was made possible through the generosity of the Norman R. and Ruth Rales Foundation. https://www.cmu.edu/graduate/rales-fellows Clarke Diplomatic Security Fellowship The William D. Clarke, Sr. Diplomatic Security (Clarke DS) Fellowship is a two-year graduate fellowship designed for individuals who want to pursue a master’s degree and a career as a Diplomatic Security Service (DSS) Special Agent in the Foreign Service. One of several high-profile State Department diversity recruitment programs, this two-year graduate fellowship supports fellows by providing academic funding for a two-year master’s degree program, two summer practicums, professional development, and mentorship. https://clarkedsfellowship.org/ DOE Computational Science Graduate Fellowship (DOE CSGF) The Department of Energy Computational Science Graduate Fellowship (DOE CSGF) supports doctoral students in fields that use high-performance computing to solve complex science and engineering problems. It fosters a community of Ph.D. students, alumni, and DOE laboratory staff committed to advancing research and impacting the nation. Established in 1991, the program is funded by the U.S. Department of Energy's Office of Science and National Nuclear Security Administration. https://www.krellinst.org/csgf/ Foreign Affairs Information Technology (FAIT) Fellowship The program is designed for highly talented individuals who want to pursue an IT-related undergraduate or graduate degree (such as computer science, information technology, cybersecurity, computer engineering, IT services administration, and computer systems networking and more). Upon successful completion of the fellowship program and the State Department’s entry requirements, fellows receive an appointment in the Foreign Service as a Diplomatic Technology Officer. https://www.faitfellowship.org/ Foreign Agricultural Service International Agricultural Fellowship Graduate fellowships for individuals pursuing two-year degrees in Agribusiness or Agricultural Economics, including two summer internships (domestic and overseas), mentoring, and professional development. Howard University administers the FAS International Agricultural Fellowship Program (IAFP) on behalf of the U.S. Department of Agriculture (USDA) Foreign Agricultural Service. Fellows enter the USDA Foreign Agricultural Service upon successful completion of the IAFP and USDA entry requirements. There is a five-year service obligation. https://www.fasfellowship.org/ Gilliam Fellows Program The Gilliam Fellows Program aspires to build a more inclusive scientific ecosystem by providing awards and benefits scientists at two levels — graduate students and their faculty thesis advisors. The program invests in graduate trainees who are committed to advancing inclusion and excellence in science, and engaging their communities in science, and empowers them as future science leaders. The Fellowship also provides support for thesis advisors to enhance their mentorship skills and act as change-makers to develop more inclusive and healthy scientific training environments. https://www.hhmi.org/programs/gilliam-fellows Google PhD Fellowship Program Google PhD Fellowships support graduate students as they pursue their PhD, as well as connect them to a Google Research Mentor. The Google PhD Fellowship Program was created to recognize outstanding graduate students doing exceptional and innovative research in areas relevant to computer science and related fields. Fellowships support promising PhD candidates of all backgrounds who seek to influence the future of technology. Our research teams impact technology used by people all over the world and we encourage people of a wide range of backgrounds to apply. We currently offer fellowships in Africa, Australia, Canada, East Asia, Europe, India, Latin America, the Middle East, New Zealand, Southeast Asia and the United States. https://research.google/programs-and-events/phd-fellowship/ Graduate Women in Science National Fellowship Program The Graduate Women in Science (GWIS) National Fellowship Program promotes knowledge in the natural and social sciences and encourages women’s academic and professional careers in the sciences. The period of the award is one academic year (July 1st through June 30th). Endowment funds, mostly generated from bequests, provide the annual income that supports scientific research conducted by GWIS fellowship winners. During the 2024-2025 funding cycle, we distributed $75,000 in research awards to nine outstanding women scientists and recognized twenty graduate students and seven early-career honorable mentions. https://www.gwis.org/page/fellowship_program Hertz Fellowship The Hertz Fellowship is awarded annually to the nation’s most promising graduate students in science and technology. Using a rigorous, merit-based process, we identify innovators with the greatest potential to create transformative solutions to the world's most urgent challenges. hertzfoundation.org/the-fellowship/ (https://www.hertzfoundation.org/the-fellowship/) Kirschstein National Research Service for Individual Predoctoral Fellows The Ruth L. Kirschstein NRSA for Individual Predoctoral Fellows (F31) Award supports promising doctoral candidates who will perform dissertation research and training for a PhD degree in a scientific health-related field relevant to the mission of the National Cancer Institute (NCI) during the tenure of the award. Applicants for the F31 must be candidates for the PhD degree and must be at the dissertation research stage of training at the time of award. NCI requires a clear cancer focus in the research training plan. Since the fellowship award does not support research costs, NCI gives funding priority to applications clearly indicating funds are available to support the candidate’s research training plan throughout the duration of the award. https://www.cancer.gov/grants-training/training/funding/f31 Knight-Hennessy Scholars Knight-Hennessy Scholars cultivates and supports a multidisciplinary and multicultural community of graduate students from across Stanford University and delivers engaging experiences that prepare graduates to be visionary, courageous, and collaborative leaders who address complex challenges facing the world. Each year we aim to select up to 100 graduate students and we fund up to three years of graduate study. kh.stanford.edu (https://knight-hennessy.stanford.edu/) Madison Fellowship Up to $24,000 towards a Master's degree focused on the U.S. Constitution, including history, political science, or education (focused on social studies and the U.S. Constitution). This is exclusively for secondary school teachers already in the classroom or those students completing a Bachelor's degree and who intend to become secondary school teachers of U.S. history, government, or civics. www.jamesmadison.gov (https://www.jamesmadison.gov/) Marshall-Motley Scholars Program Established by the NAACP Legal Defense Fund (LDF), the Marshall-Motley Scholars Program (MMSP) is committed to identifying and investing in the next generation of aspiring lawyers dedicated to pursuing racial justice in the South, and for whom this work is a personal and professional calling. The MMSP will support and develop the next wave of civil rights lawyers in the South, where the majority of Black Americans live. We invest in the establishment of a corps of civil rights attorneys who will be equipped to advocate on behalf of Black communities in the South seeking racial justice and equity. marshallmotleyscholars.org (https://www.marshallmotleyscholars.org/) Mellon/ACLS Dissertation Innovation Fellowship Program The Mellon/ACLS Dissertation Innovation Fellowship program is designed to support emerging scholars as they pursue bold and innovative research in the humanities and interpretive social sciences. The fellowships are designed to intervene at the formative stage of dissertation development, before writing is advanced, and provide time and support for emerging scholars’ innovative approaches to dissertation research – practical, trans- or interdisciplinary, collaborative, critical, or methodological. The program seeks to expand the range of research methodologies, formats, and areas of inquiry traditionally considered suitable for the dissertation, with a particular focus on supporting scholars who can build a more diverse, inclusive, and equitable academy. https://www.acls.org/programs/mellon-acls-dissertation-innovation-fellowships/ NAEd/Spencer Dissertation Fellowship The National Academy of Education/Spencer Dissertation Fellowship encourages a new generation of scholars from a wide range of disciplines and professional fields to undertake research relevant to the improvement of education. This fellowship supports candidates whose dissertation projects bring innovative and insightful approaches to the history, theory, analysis, or application of formal and informal education. As a highly competitive initiative, this fellowship annually identifies and supports 35 of the most exceptional researchers conducting dissertation studies relevant to education. https://naeducation.org/naed-spencer-dissertation-fellowship/ National Defense Science and Engineering Graduate Fellowship Program The DoD National Defense Science and Engineering Graduate (NDSEG) Fellowship Program is a competitive fellowship that is awarded to U.S. citizens, nationals, and dual citizens who intend to pursue a Doctoral degree aligned to the DoD services Broad Agency Announcements (BAAs) in research and development at a U.S. institution of their choice. The NDSEG Fellowship Program was established in 1989 by direction of Congress as an approach to increasing the number of U.S. citizens receiving doctoral degrees in science and engineering (S&E) disciplines to DoD Relevance. https://ndseg.sysplus.com/ National Science Foundation Graduate Research Fellowship Program NSF GRFP was established to recruit and support individuals who demonstrate the potential to make significant contributions in STEM. NSF especially encourages applications from undergraduate seniors and Bachelor's degree-holders interested in pursuing research-based graduate study in STEM. First- and second-year graduate students in eligible STEM fields and degree programs are also encouraged to apply. https://www.nsf.gov/funding/opportunities/grfp-nsf-graduate-research-fellowship-program Newcombe Doctoral Dissertation Fellowships The Charlotte W. Newcombe Doctoral Dissertation Fellowships support doctoral candidates in their final year of work on Ph.D. dissertations in areas of religion, ethics, values, or morals. The conversation may be from the ancient past, with modern relevance; it may be a unique perspective on a well-known topic; it may revolve around culture, art, societies, or identity. Those awarded a Newcombe Fellowship are often at the forefront of creative and original scholarship, proposing new insights and ground-breaking work in the questions and conversations surrounding religion, ethics, and values. https://newcombefoundation.org/fellowships/ P.E.O. Scholar Awards The P.E.O. Scholar Awards were established in 1991 to provide substantial merit-based awards for women of the U.S. and Canada who are pursuing a doctoral-level degree at an accredited college or university. In addition to recognizing and encouraging excellence in higher education, these awards provide partial support for study and research for women who will make significant contributions in their varied fields of endeavor. https://www.peointernational.org/educational-support/scholar-awards/ https://www.peointernational.org/educational-support/international-peace-scholarship-fund/ Pickering Graduate Foreign Affairs Fellowship The Thomas R. Pickering Graduate Foreign Affairs Fellowship is a merit and need-based U.S. State Department program collaboratively administered by the Bureau of Global Talent Management and Howard University that prepares highly talented individuals for careers as diplomats in the Foreign Service of the U.S. Department of State. The program is grounded in the principle that a broad range of perspectives strengthen diplomatic efforts and foster a comprehensive approach to global challenges. Fellows are selected based on demonstrated merit and financial need. https://pickeringfellowship.org/ Quad Fellows The Quad Fellowship supports 100 exceptional American, Japanese, Australian, and Indian master's and doctoral students in science, technology, engineering, and mathematics (STEM) to study in the United States. The fellowship develops a network of science and technology experts committed to advancing innovation and collaboration in the private, public, and academic sectors, in their own nations and among Quad countries. quadfellowship.org (https://www.quadfellowship.org/) Rangel International Affairs Graduate Fellowship The Charles B. Rangel Graduate Fellowship is a program that aims to attract and prepare outstanding young people for careers in the Foreign Service of the U.S. Department of State in which they can help formulate, represent and implement U.S. foreign policy. The Rangel Program selects outstanding Fellows annually and supports them through two years of graduate study, internships, mentoring, and professional development activities. This program encourages the application of members of minority groups historically underrepresented in the Foreign Service, women, and those with financial need. Fellows who successfully complete the program and Foreign Service entry requirements will receive appointments as Foreign Service Officers, in accordance with applicable law and State Department policy. https://rangelprogram.org/graduate-fellowship-program/ SMART Scholarship The Department of Defense (DoD) SMART (Science, Mathematics, and Research for Transformation) Scholarship is a prestigious program designed to support undergraduate, graduate, and doctoral students pursuing degrees in science, technology, engineering, and mathematics (STEM) fields. In exchange for full tuition and a stipend, recipients commit to working as civilian employees at DoD laboratories after graduation. https://www.smartscholarship.org/ Soros Fellowships for New Americans The Paul & Daisy Soros Fellowships for New Americans provides merit-based funding for New Americans, immigrants and children of immigrants, who are poised to make significant contributions to US culture, society and academia. https://pdsoros.org/ Tillman Scholars Program The Pat Tillman Foundation identifies remarkable military service members, veterans and spouses, empowering them with academic scholarships, lifelong leadership development opportunities and a diverse, global community of high-performing mentors and peers. Our scholars are making an impact as they lead through action in the fields of healthcare, business, public service, STEM, education and the humanities. https://pattillmanfoundation.org/apply/ Udall Native American Graduate Fellowship The Morris K. Udall and John S. McCain III Native American Graduate Fellowship in Tribal Policy (Native American Graduate Fellowship) recognizes outstanding Native American and Alaska Native graduate students who are currently pursuing advanced degrees in health care fields—including, but not limited to, health administration, health education, public health, medical practice, policy, research, or related-degrees—and who have demonstrated a commitment to Native health care. The Native American Graduate Fellowship Program honors the legacies of Morris K. Udall and John S. McCain III. https://www.udall.gov/OurPrograms/Fellowship/Fellowship.aspx Wenner-Gren Dissertation Fieldwork Grant This grant supports doctoral or thesis research that advances anthropological knowledge. It welcomes proposals that integrate multiple subfields and pioneer new approaches and ideas. https://wennergren.org/program/dissertation-fieldwork-grant/ Domestic Fellowship Programs Emerson National Hunger Fellowship The Bill Emerson National Hunger Fellowship is a leadership development program for emerging leaders who want to fight hunger and poverty in the U.S. It combines hands-on work with community-based organizations and policy experience with national nonprofits or government agencies. https://www.hungercenter.org/what-we-do/emerson-fellowship/ Gaither Junior Fellows Program The James C. Gaither Junior Fellows Program at the Carnegie Endowment for International Peace is designed to provide a substantive work experience for students who have a serious career interest in international affairs. Students who are selected will be hired to work as employees at the Carnegie Endowment in Washington, DC on a full-time basis for a period of one year. https://carnegieendowment.org/james-c-gaither-junior-fellows-program?lang=en Hertog War Studies Program The Hertog War Studies Program is an intensive two-week program run by the Institute for the Study of War in Washington, DC. The program aims to educate advanced undergraduate students about the theory, practice, organization, and control of war and military forces. Students will learn from and interact with distinguished senior leaders in the national security and military communities. This course bridges the civil-military divide and teaches students at the start of their careers how to assess military decision-making. https://hertogfoundation.org/programs/war-studies Humanity in Action Fellowship The Humanity in Action Fellowship brings together diverse groups of emerging leaders to explore national histories of discrimination and resistance, including issues affecting minority groups. Fellows engage in intensive seminars, site visits, and discussions with academics, activists, policymakers, and artists to explore social justice, democracy, and human rights. https://humanityinaction.org/fellowship/ Horseshoe Farm Community Health Fellowship A 13-month, full-time, community-based gap year fellowship for recent college graduates interested in community health, education, nonprofit leadership, and citizen service. Fellows work directly with vulnerable populations—including seniors, adults with mental illness, and children—through programs in Alabama and California. The fellowship provides intensive mentorship, leadership development, and hands-on experience in community health initiatives. https://www.projecthsf.org/community-health-fellowship Mirzayan Science & Technology Policy Graduate Fellowship Launched in 1997, the Christine Mirzayan Science & Technology Policy Graduate Fellowship Program is a full-time, hands-on workforce training and educational program that provides early career individuals with the opportunity to spend 12 weeks at the National Academies of Sciences, Engineering, and Medicine in Washington, DC learning about science and technology policy and the role that scientists and engineers play in advising the nation. https://mirzayanfellow.nas.edu/ NIAID Intramural Research Training Award (IRTA) & Visiting Fellowship Program (VFP) The National Institutes of Health (NIH), National Institute of Allergy and Infectious Diseases (NIAID) Intramural Research Training Awards and Visiting Fellowships Program are designed to provide advanced developmental training and practical research experiences in disciplines related to biomedical research, medical library research, and related fields. To promote and develop the next generation of biomedical researchers, NIAID is committed to offering a broad spectrum of paid training opportunities, ranging from undergraduate internships to postdoctoral fellowships. Trainees conduct research focused on understanding, treating, and preventing infectious, immunologic, and allergic diseases in NIAID labs located in Maryland and Montana, where they have access to a unique scientific research training environment in basic, translational, and clinical research. https://www.niaid.nih.gov/about/fellowships-internships-and-training Center for the Study of the Presidency and Congress Presidential Fellows Over the course of an academic year, the Fellows learn about leadership and governance, hone their research skills, and engage in civil discourse with public officials, policy experts, and their peers. Selected students participate in monthly virtual seminars, write a 10-15 page original research paper (with the support of a mentor), and attend an all-expense-paid conference in Washington, D.C. https://www.thepresidency.org/presidential-fellows-program Samvid Scholars We support future leaders with exceptional potential and commitment to drive change for society at scale through: leadership development (2 years of leadership development to build the understanding, skills, and support to help Scholars to fulfill their potential), community (a growing community of Scholars and alumni to foster cross-disciplinary collaboration, mentorship, and life-long relationships), and financial support. https://samvidscholars.org/ Udall Native American Congressional Internship Program The Native American Congressional Internship Program provides Native American and Alaska Native students with the opportunity to gain practical experience with the federal legislative process in order to understand first-hand the government-to-government relationship between Tribes and the federal government. https://www.udall.gov/OurPrograms/Internship/Internship.aspx The Harry S. Truman Scholarship Foundation (https://www.truman.gov/) Required Statements (https://www.truman.gov/required-statements) Facebook (https://www.facebook.com/TrumanScholarship) Instagram (https://www.instagram.com/trumanfoundation) Twitter (https://twitter.com/TrumanApp)"
