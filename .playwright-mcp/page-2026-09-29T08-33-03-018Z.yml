m/view/38925596) Summer 2026: Sacred Ground View and Download PDF Version of Magazine (https://online.flippingbook.com/view/106580915/) Spring 2026: Masonic Style View and Download PDF Version of Magazine (https://online.flippingbook.com/view/686900123/) View All Issues (https://freemason.org/issue/) Current Issue Fall 2026: Masonic Los Angeles (https://freemason.org/philanthropy/education-and-literacy/) 38925596 About Us Close About Us Open About Us Overview About Us Get to know the Masons of California and its entities. (https://freemason.org/about-us/) Leadership Meet our leadership. (https://freemason.org/leadership/) California Masonic Memorial Temple Explore our landmark. (https://freemason.org/about-us/cmmt/) Endomosaic Learn the history and symbolism of this mural. (https://freemason.org/about-us/endomosaic/) Careers (https://freemason.org/about-us/careers/) Media Kit Resources (https://freemason.org/about-us/#media-resources) Opening the Door (https://freemason.org/wp-content/uploads/2026/04/Opening-the-Door-Guide-to-Masonry.pdf) A Simple Guide to Understanding—and Talking About—Freemasonry Philanthropy & Impact Masonic Education & Literacy Masons have always been closely associated with public education. Today, we still proudly support public schools and initiatives at every level of the community. Public Education College Success and Access CA Teacher of the Year Public education Public education is one of our fraternity’s most treasured causes – and one that Masons have championed for hundreds of years. We believe that in order for civil society to thrive, all children must have access to the free public education necessary to grow into conscientious productive citizens. Raising a Reader Raising a Reader is an award-winning early literacy and family engagement program that helps young children build strong reading habits at home. Through this partnership, the California Masonic Foundation helps bring high-quality books, family education and classroom support to children in California schools where early literacy support can make the greatest difference. Center for Family Math The Center for Family Math partnership helps young children build early math confidence through family engagement, play-based learning and at-home resources. Through this work, the Masons of California are helping families and educators give students a stronger foundation in math during the years when early learning habits take shape. Career and technical training The California Masonic Foundation's Working Tools program supports career and technical training in California high schools. It focuses on supporting programs that give students a path to good-paying jobs in technical careers in a high school setting. College success and access Our Masonic scholarship program gives high school seniors who demonstrate an active pursuit of education in spite of hardships to attain a higher education. Although these students may not fit the traditional profile of a high academic performer, they have overcome significant obstacles to achieve their goals, demonstrating extraordinary potential and strength of character. If they remain eligible, scholarship recipients retain their scholarship through the entirety of their education. Success Stories CA teacher of the year The California Masonic Foundation is proud to support exemplary educators throughout our state, especially those who are chosen to receive the prestigious California Teacher of the Year Award. As the longest-continuing sponsor of the California Teacher of the Year Awards, over 250 teachers have been honored for their dedication to their students. Current and Past Nominees Be part of the change Our philanthropic causes are supported entirely by generous contributions from California Masons and our families and friends Donate Now (https://freemason.org/give-now/) Address Grand Lodge of California 1111 California Street San Francisco, CA 94108 Contact (415) 776-7000 (tel:(415)%20776-7000) memb