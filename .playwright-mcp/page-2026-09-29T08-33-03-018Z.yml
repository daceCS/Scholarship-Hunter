          - generic [ref=e258]: "GSUSA Gold Award Scholarship Application I am in {{stepName}}: {{currentStep}} I am in {{stepName}}: Scholarship Qualified I am in {{loginUserName}} Dashboard Track My Work Preview Report Project Notes Help & FAQ Profile Sign Out You are viewing GSUSA Gold Award Scholarship Application in Read-Only mode. This is because either you are not yet eligible or accessing the page outside of application period. Saving... Changes detected Changes not saved! / Start Profile Council Title Theme Prompts 1 Prompts 2 Visuals Experience Log Files Preview Send Files Submit Start Profile Council Title Theme Prompts 1 Prompts 2 Visuals Experience Log Files Preview Send Files Submit Start Profile Council Title Theme Prompts 1 Prompts 2 Visuals Experience Log Files Preview Send Files Submit Start Profile Council Title Theme Prompts 1 Prompts 2 Visuals Experience Log Files Preview Send Files Submit Next Steps GSUSA Gold Award Scholarship Application Requirements and Expectations: If I am selected as a GSUSA Gold Award Scholarship Recipient, I agree to do the following: Respond to requests to represent Girl Scouts through public relations, web/social, speaking engagements or other related opportunities. Follow the GSUSA Gold Award Scholarship Policy. Sign and return all required documents including photo/media release and scholarship commitment, report, and disbursement forms. Complete the GSUSA-issued report form at the end of semester where my funds were expended, describing my experience and accomplishments, and including detailed substantiation (ie: payment receipts and/or itemized invoices from the university) of how the funds were used. Represent Girl Scouts to the best of my abilities and uphold the Girl Scout Promise and Law at my college or university. I Agree GSUSA Gold Award Scholarship Application Finalize your profile Ensure we have your current contact information. Pro-tip: Check your spelling and grammar! Profile photo <p><b>Photo Pro-Tips:</b></p> <p>Your photo should be a formal head-and-shoulders image of you, such as a yearbook photo or other studio portrait. Informal head-and-shoulders images are welcome but should be free of distracting objects in the background. Please also avoid tank tops, bathing suits, bare shoulders, low-cut shirts, and clothing with logos or bold patterns. Ensure your photo is no larger than 10 MB.</p> (Click to edit) File size : 25mb Size of the uploaded pic is too large. Select New Remove Save Select New Cancel Email This Field is required Please enter the valid email Id First Name First Name is required. Minimum 1 Characters Required Exceeded Max length. Max Length: 30 Last Name Last Name is required. Minimum 1 Character Required. Max. length: 30 Characters Country Select the country Street Address 1 This field is required Min Lenght: 5 Characters Max Length : 200 Characters Street Address 2 (optional) City This field is required State This field is required Province/Country This field is required Min. length: 5 Characters Max. length: 200 Characters Zip This field is required Min. length: 1 digit Max. length: 5 digit enter Numbers only Postal Code This field is required Minimum 1 character required. Maximum character limit is 15. Date Of Birth This field is required You must be at least 13 years old to register for a GoGold account Current Grade This field is required GSUSA Gold Award Scholarship Application Confirm your council Is that your council’s logo? If yes: proceed! If not, select the correct council from the drop-down menu. Council Name This field is required GSUSA Gold Award Scholarship Application Gold Award Title Double-check your Gold Award’s title. Update if necessary! Gold Award Title This field is required Min length: 3 char Max length: 100 char GSUSA Gold Award Scholarship Application Gold Award Theme(s) Select the theme(s) that best represent your Gold Award and its impact. Remember you can select up to five themes. Please select at least 1 answer Please select at least 1 answer Max of 5 selections reached Animals Arts, Culture & Heritage Children's Issues Civic Engagement Disability Issues Disaster Relief Education Elderly Issues Environment & Sustainability Entrepreneurship Health Healthy Relationships Human Rights Life Skills Military/Veterans Affair Outdoors Poverty Public Safety Sports STEM GSUSA Gold Award Scholarship Application Prompts <h3><b>Video submission guidelines&nbsp; &nbsp; &nbsp;&nbsp;</b></h3> <p>Each video should be in a linkable&nbsp;format that you can make public and&nbsp;upload to a sharable site such as&nbsp;YouTube or Vimeo. Please share each&nbsp;link in the appropriate prompt’s text&nbsp;box.&nbsp;</p> <ul> <li>The video can be made using any recordable device, including a cellphone, tablet, or digital camera. Note: If recording your video from your cellphone please hold the phone horizontally as it captures higher quality video.</li> <li>Be sure that the recording on the video is clear and audible and that there are no visible or audible distractions in the background.&nbsp;</li> <li>Your video&nbsp;<b>does not</b>&nbsp;need to be professionally shot or edited—the review committee is more focused on getting to know you, your passion and impact!</li> </ul> Answer each prompt via written essay or video response. If you choose video response: each video should be recorded in a linkable format that you can make public and upload to a sharable site such as YouTube or Vimeo. The public link should be hyperlinked or copy-pasted in the appropriate prompt’s text box. See video submission guidelines in the help icon () above for details. In 2000 characters or less, please summarize your Gold Award project. Summarize your project in a narrative describing the root cause, how your project addresses it, and how you achieved your goal. Be sure to indicate how you displayed leadership detailing 1) how you lead a team to accomplish your goals and 2) if/how you involved the community you served in your solution. 0 / 2000 This field is required In 2000 characters or less, please describe how your project had measurable and sustainable impact. Share how you collected information or data throughout your project and used it to show how your actions had an impact on your issue. Then, share how your project carries on or continues to have impact even after you’ve done your part! 0 / 2000 This field is required GSUSA Gold Award Scholarship Application Prompts <h3><b>Video submission guidelines&nbsp; &nbsp; &nbsp;&nbsp;</b></h3> <p>Each video should be in a linkable&nbsp;format that you can make public and&nbsp;upload to a sharable site such as&nbsp;YouTube or Vimeo. Please share each&nbsp;link in the appropriate prompt’s text&nbsp;box.&nbsp;</p> <ul> <li>The video can be made using any recordable device, including a cellphone, tablet, or digital camera. Note: If recording your video from your cellphone please hold the phone horizontally as it captures higher quality video.</li> <li>Be sure that the recording on the video is clear and audible and that there are no visible or audible distractions in the background.&nbsp;</li> <li>Your video&nbsp;<b>does not</b>&nbsp;need to be professionally shot or edited—the review committee is more focused on getting to know you, your passion and impact!</li> </ul> Answer each prompt via written essay or video response. If you choose video response: each video should be recorded in a linkable format that you can make public and upload to a sharable site such as YouTube or Vimeo. The public link should be hyperlinked or copy-pasted in the appropriate prompt’s text box. See video submission guidelines in the help icon () above for details. In 2000 characters or less, please describe how your project had a local connection to a national or global issue. Why does your project matter? Explain how your project meaningfully addressed an issue that is relevant nationwide and/or worldwide. 0 / 2000 This field is required In 2000 characters or