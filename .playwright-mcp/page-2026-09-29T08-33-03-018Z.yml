          - generic [ref=e66]: "1 | P a g e AHEPA - Educational Foundation (AEF) Scholarship Application 2026 (Applicable for 2026 ONLY) ONLY) 1909 Q Street N.W., Suite 500 Washington, DC 20009 Tel: 202-232-6300 Fax: 202-232-2140 Email: admin@ahepa.org**PLEASE MAKE SURE TO FILL OUT YOUR MAILING ADDRESS CLEARLY AND PROPERLY*** *Last Name: *First name: *Permanent Mailing Address: CITY: STATE: ZIP: *E-MAIL: *Social Security number: Scholarships available: (Please check ONLY ONE) _____ Undergraduate I – High School Seniors or College Freshmen _____ Undergraduate II – College Sophomores or Junior’s _____ Graduate School – College Seniors or Graduate school students _____ Hellenic College / Holy Cross Seminary _____ Webster University (Full Scholarship for AHEPA District 25 applicants ONLY) _____ Webster University (30% Tuition Scholarship) _____ Chariclea Christodulakis-Cummins Educational Charity Fund Scholarship (4yr Financial Need-Based for graduating Female H.S) Un-weighted GPA, (maximum 4.0 Scale) (Applicant MUST CONVERT themselves!!! (DO NOT ROUND- UP!!!) i.e., if you got a 3.173 (DO NOT LIST) as 3.72!!!) (If not converted by applicant, the application will be automatically disqualified!!! (HIGH SCHOOL SENIORS OR COLLEGE FRESHMEN): SAT - Total Score for Undergraduate I only: (The official scores from the appropriate testing agency must be submitted with the official transcript from your Secondary school) And Or ACT - Total Score for Undergraduate I only: (The official scores from the appropriate testing agency must be submitted with the official transcript from your Secondary school) Type of Scholarship: (Please check ONLY ONE!!!) Scholastic Achievement: Financial Need: (If you choose this option, applicant must provide a copy of their 2025 1040 tax form!) **MANDATORY FOR CONSIDERATION WITH THIS CHOICE** Membership in AHEPA in either of the Family orgs (AHEPA, DOP, SOP & MOA) : (Please check ONLY ONE that applies) _____ Yourself _____ Father _____ Mother _____ Grandfather _____ Grandmother (ID number must be a member) paid through: / / (MUST BE PAID THRU 12/31/26) ***Academic Concentration ___________________________________________________________ **(Mandatory) (Must Attach Photo Here) Photo Size 2” X 2” **(NO BIGGER) **(Mandatory) (If not placed here applications are automatically disqualified!!!) -- 1 of 7 -- 2 | P a g e AHEPA - Educational Foundation (AEF) Scholarship Application 2026 (Applicable for 2026 ONLY) ONLY) Criteria Page: 1. Scholarship Program: The AHEPA Educational Foundation (AEF) is dedicated to fostering higher education through its scholarship programs, which are available for application from January 2nd through March 31st each year. AEF aims to support students pursuing studies at college, university, and graduate school levels. The scholarship awards, which may reach up to a maximum of $2,500.00 and are designed to alleviate the financial burdens faced by students and are payable directly to the recipient. It is an excellent opportunity for eligible candidates to receive financial assistance to help further their educational goals. Applicants are encouraged to review the specific criteria and submission requirements to ensure they have the best chance of receiving support from this valuable initiative. 2. Eligibility: To be eligible for a scholarship from the AHEPA Educational Foundation (AEF), applicants must certify that they meet Criteria A and B, along with either Criteria C or D, in addition to Criteria A. This structured approach ensures that the foundation supports students who not only excel academically but also embody the principles of Hellenism. AEF is dedicated to recognizing and assisting students of Hellenic descent, as well as Phil-Hellenes, who demonstrate a commitment to the ideals promoted by the Greek heritage. It is essential for applicants to maintain a minimum GPA of 3.0 to qualify for consideration. This requirement reinforces the foundation's commitment to academic excellence while also aiding students in financial need. Interested candidates should thoroughly review the specific eligibility requirements and prepare their applications accordingly during the open application period from January 2nd to March 31st. A. To be eligible for a scholarship from the AHEPA Educational Foundation, applicants or their father/mother/grandparents (MUST BE AN ACTIVE AND CURRENT YEAR (2026) PAID MEMBER) of anyone of the AHEPA Family (AHEPA, Daughters of Penelope, Sons of Pericles, or Maids of Athena)! They must also be of Hellenic descent or identify as Phil-Hellenes, emphasizing the foundation's commitment to community involvement and the promotion of Hellenic values. (For those who are not paid members, please visit www.ahepa.org/jointo become an active paying member) B. A high school graduate or a high school senior planning to attend, full time, an Accredited College or University During the 2026 academic year; or C. A college student currently attending an Accredited College or University and will continue to attend, full time, During the 2026 academic year; or D. A College or University graduate planning to attend, full time, a graduate or professional degree program During the 2026 academic year **Note: A scholarship recipient can ONLY BE AWARDED (1) scholarship EVER as an Undergraduate student and as a Graduate student!!!** 3. Filing This scholarship form is applicable for year 2026 only. Application requirements and check list: A. Completed Application (DO NOT Place in Binders and or Folders with Separated Sheeting)!!! B. Academic Transcript (Must be on a 4.0 scale) C. Two letters of recommendation (Section 15 Letters of Recommendations) D. Photo: One passport size non-returnable photo (Attached to Page 1 of application Photos any larger than Passport size (2 x 2) or action shots ARE NOT acceptable!!!) E. Financial need documentation, if applicable (Section 14 Financial Need) THE ENTIRE CONTENTS OF THE APPLICATION (ITEMS A THROUGH E ABOVE) MUST BE COMPLETE OR YOU WILL AUTOMATICALLY DISQUALIFIED! ALL ITEMS MUST BE SUBMITTED IN ONE ENVELOPE! The applicant is responsible for the submission of all documents (all are required, except Section 14 Financial Need, which is optional) and completion of all sections of this application and mailing the application package by any delivery service that can ascertain proof of delivery certified mail / return receipt requested via USPS or FedEx, UPS and or DHL (Emailed and or faxed applications ARE NOT acceptable). Please mail to the following address: AHEPA Educational Foundation 1909 Q Street N.W., Suite 500 Washington, DC 20009 All information will be kept confidential, and no items will be returned!!! Complete Application packets received after the deadline date in March (WILL NOT) be considered!!! All Scholarship applicants (Will be NOTIFIED via official letter sent through USPS) during the Fall Semester of the application year!!! Scholarship applicants must be an active and current year paid members of their local or National AHEPA, Daughters of Penelope, Sons of Pericles and or Maids of Athena! -- 2 of 7 -- 3 | P a g e AHEPA - Educational Foundation (AEF) Scholarship Application 2026 (Applicable for 2026 ONLY) ONLY) 4. List of Scholarships Available: The following is a partial list of the Scholarships available from Benefactors and major Donors. We would like to acknowledge their generosity and thank them for this opportunity to honor our outstanding youth and in a small way assist in the education of Greek American students. A. GRADUATE STUDIES Nick Cost Scholarship. Dr. John C. Yavis Scholarship. P. A. Margaronis Scholarship. Sam Dakis Scholarship. James Demas Scholarship. George Leber Scholarship. Nicholas Kounaris Scholarship. Spiro and Cleo Millios Scholarship. William Thomas Scholarship. Athanasios and Ekaterini Backus Scholarship. Spiro and Cleo Millios Scholarship. John George Tsitsos Scholarship. B. UNDERGRADUATE STUDIES George Leber Scholarship. George & Helen Constantine Scholarship. George Chirgotis Scholarship. Nick Cost Scholarship. James Demas Scholarship. P.A. Margaronis Scholarship. Sam Dakis Scholarship. William Thomas Scholarship. C. HELLENIC COLLEGE/HOLY CROSS SEMINARY SCHOLARSHIPS Carlos T. Touris Scholarship. Archbishop Demetrios Scholarship. Nick Cost Scholarship. John George Tsitsos Scholarship. D. AHEPA NATIONAL HOUSING CORPORATION SCHOLARSHIPS Available to undergraduate / graduate students who are majoring in gerontology, geriatrics, nursing, medicine, physical therapy, public administration, management studies or property management E. JAMES G. PULOS MEMORIAL SCHOLARSHIP Available to undergraduate students who are majoring in engineering, medical sciences and nursing also available to graduate students who are majoring in biotechnology/bioengineering, genetic sciences and political sciences! Both categories are for students with a primary residence in the following states (VA, MD, CT, DE, NY, NJ, PA & MA) or the District of Columbia F. WEBSTER UNIVERSITY – ATHENS CAMPUS a. (Up to 5 Scholarships per year); available to undergraduate / graduate students from AHEPA District 25 (ONLY) for a degree offered at Webster’s Athens Campus. Scholarship recipients are selected from applicants who are AHEPA’s District 25 (ONLY) members and are solely based on merit and financial need. All scholarship recipients must maintain a 3.3 GPA or higher for their entire studies.b. Available to undergraduate / graduate students from AHEPA for a degree offered at Webster’s Athens Campus. Scholarship recipients are selected from applicants who are AHEPA members. All scholarship recipients must maintain a 3.0 GPA or higher for their entire studies. G. CHARICLEA CHRISTODULAKIS-CUMMINS EDUCATIONAL CHARITY FUND SCHOLARSHIP This scholarship was created to help lessen the financial burden on a student who would have otherwise not pursue a college degree due to financial constraints and hardships. A $10,000 financial need-based Scholarship available only to, a graduating (female) High School student, whom, (1) has applied to and or has been accepted and admitted to an accredited (4 year) Undergraduate College and or University in the United States. (2) Applicant will matriculate at such said College and or University at the beginning of the first academic year that immediately follows the date of the award. (3) The applicant must submit her letter of acceptance to such said accredited (4 year) U.S. College and or University, a notarized affidavit attesting that, she has never been convicted of a felony, a notarized letter of recommendation from her High School, Principal, Guidance Counselor and or Parish Priest, a copy of their parent(s) / Legal Guardian(s) Federal Income tax return of the prior year w/ an notarized affidavit attesting that the copy is true and the applicant, parent(s) and legal guardian(s) must have been a member of AHEPA for no less than (1) year prior to the scholarship deadline date of March 30th H. CONSTANTINE AND PATRICIA MAVROYANNIS SCHOLARSHIP The Constantine and Patricia Mavroyannis Scholarship is open to graduate students who are either Greek or of Greek heritage and are enrolled in a PhD program in either theoretical physics or physical chemistry in the Faculty of Science at a North American university. The scholarship is in the amount of $5,000 and will be awarded in the fall semester. Thanks to the generosity of Dr. Constantine and Mrs. Patricia Mavroyannis, this scholarship recognizes scholastic achievement and an interest and commitment to studying theoretical physics or physical chemistry by providing financial assistance to Hellenic graduate students to pursue their studies in these fields. (The purpose of the Constantine and Patricia Mavroyannis Scholarship is to recognize the importance of education – specifically, to reward and encourage educational achievement by Hellenes in the fields of physics and chemistry and thereby support Hellenic contribution to the global scientific community. The scholarship honors the life and accomplishments of Dr. Constantine Mavroyannis, an internationally renowned career theoretical physicist with the National Research Council of Canada, and his wife Patricia.) For more information on how to apply for this specific scholarship, please Contact: Jennifer Kellogg, jkellogg@ahepa.org -- 3 of 7 -- 4 | P a g e AHEPA - Educational Foundation (AEF) Scholarship Application 2026 (Applicable for 2026 ONLY) ONLY) Note: Many of the scholarships were donated by Greek immigrants who recognized the importance of education. When you complete your studies, remember the opportunity afforded you and return the gesture by donating to the AHEPA Educational Foundation so that we can continue to assist worthy students. Often, a scholarship can make a difference and change life. 5. Type of Scholarships: Special consideration will be given to students applying for scholarships based on financial need. In both types of applications, consideration will also be given for AHEPA affiliation, extra-curricular activities, community service. A. SCHOLASTIC ACHIEVEMENT B. FINANCIAL NEED ( Must demonstrate financial need by completing Section 14 and providing the necessary documentation!!!) 6. Scholarships that are currently Available: Undergraduate Studies I, for: High School Seniors or College Freshmen Undergraduate Studies II, for: College Sophomores and Junior’s Graduate Studies for: College Seniors or Graduate School Students Seminary: Hellenic College / Holy Cross Seminary Webster University – Athens Campus: (Full Scholarship for AHEPA District 25 Applicants ONLY) Webster University- Athens Campus: (30% Tuition Scholarship) Chariclea Christodulakis-Cummins Educational Charity Fund Scholarship: (A onetime Financial Need-Based for graduating Female H.S. Student) Constantine and Patricia Mavroyannis Scholarship: For more information on how to apply for this specific scholarship, please Contact: Jennifer Kellogg, jkellogg@ahepa.org 7. Application Requirements: ACADEMIC TRANSCRIPT 1) Undergraduate I: High school seniors must submit official high school transcript including S.A.T. and / or A.C.T. scores (if taken). College Freshmen only need to submit their most recent official College Semester Transcript. Transcripts must include GPA and GPA scale (i.e., 3.83 out of 4.0. (If not on 4.0 scale The Applicant (MUST CONVERT THEMSELVES) before submitting application packet!!!) ***IF NOT CONVERTED APPLICANT WILL BE DISQUALIFIED*** 2) Undergraduate II: College undergraduates (sophomores or juniors) must submit full official current college semester transcript. 3) Graduate Students: College seniors and graduate students must submit both official undergraduate college and graduate school transcripts. Note: All transcripts must be originals, not copies, accompanying the application in a separate sealed envelope B. Applicants must include (ONLY (2) letters of recommendation, i.e., the applicant’s teachers, counselors, advisors, professors, pastor, etc . (NONE of the reference letters may be from relatives of the applicant!!! The letters must be included in the application packet, in a separate sealed envelope.) -- 4 of 7 -- 5 | P a g e AHEPA - Educational Foundation (AEF) Scholarship Application 2026 (Applicable for 2026 ONLY) ONLY) 8. Personal data: Last Name: First Name: Middle Initial Street Address: CITY: STATE: ZIP: Date of Birth City of Birth: State: Country: Citizenship: U.S. citizen: U.S. Permanent Resident Alien: Resident Alien #: Citizen of (Specify Country): Visa type: Location in Greece: Are you or anyone in your immediate family an active member of the AHEPA Family? Yes or No (circle only one) Any immediate family (Father, Mother, Brother, Sister) served on the District or Supreme Lodge? Yes or No (circle only one) **List only (one)** Name of Family Member & Position: **Check only one**: AHEPA DOP MOA SOP **(Membership ID number of family members mandatory if a member) Chapter number / City / State (MM / DD / YR ) (Paid through date on card) **Found on membership card** **(Mandatory) -- 5 of 7 -- 6 | P a g e AHEPA - Educational Foundation (AEF) Scholarship Application 2026 (Applicable for 2026 ONLY) ONLY) 9. Educational data: Name of Academic institution you will be or are considering attending for the ( Fall Semester of 2026): Institutions Name: Address: City: State: Zip code: 10. Academic Honors: Please list the most recent academic honors which you have received and by whom they were awarded (Honors, letters or extracurricular activities on lines below) (In this space ONLY… (DO NOT) provide any extra material on separate paper **it will be discarded**!!) Honors: Letters earned: 11. Extracurricular, school activities and volunteer community activities (including summer): Please list and describe your principal extracurricular, community, and volunteer social activities i.e. clubs, societies, sports, etc. (In this space ONLY… (DO NOT) provide any extra material on separate paper **it will be discarded**!!) -- 6 of 7 -- 7 | P a g e AHEPA - Educational Foundation (AEF) Scholarship Application 2026 (Applicable for 2026 ONLY) ONLY) 12. Financial Information: Personal family gross income (Form 1040, Line #22) must be less than $100,000 to qualify. The Applicant must provide (if still living with parent’s) a copy(s) of Parent(s) and or Guardian(s)2025 Federal Income Tax 1040 form pages 1 and 2 (attach information to application). (IF NOT SEEKING financial assistance please DO NOT supply)!!! 13. Letters of recommendations: Applicants shall provide ONLY (2) letters of recommendation!!! The letters cannot be from family members! The letters must provide the recommender’s name, contact information, responsibilities, years of involvement and relationship with the applicant. Most importantly, the letter should address why the applicant should receive the scholarship. (Letters to be included mailed with your application packet!) 14. Scholarship Awards: ***Please Note: All items must be submitted in (1) envelope package to be considered. We will not piece your packet together for you!!! ***Please Note: DO NOT provide application in any (3) ringed or tabbed binders and or separated via individual dividers or your application will be disqualified!!! *** Please Note: Please make sure you list your permanent mailing address clearly and complete on the first Page!!! -- 7 of 7 --"
