ipamerica.org/donors/employer-matching-gifts/) Planned & Estate Giving (https://scholarshipamerica.org/donors/planned-and-estate-giving/) Students (https://scholarshipamerica.org/students/) College is expensive, and financial aid can be a complex challenge. Scholarship America is here to help you every step of the way, no matter what your educational goals might be. Scholarships for High School Students (https://scholarshipamerica.org/students/scholarships-for-high-school-students/) Scholarships for STEM Students (https://scholarshipamerica.org/students/scholarships-for-stem-students/) Scholarships for Community College Students (https://scholarshipamerica.org/students/scholarships-for-community-college-students/) Scholarships for Current College Students (https://scholarshipamerica.org/students/scholarships-for-current-college-students/) Scholarships for Veterans (https://scholarshipamerica.org/students/scholarships-for-veterans/) Browse Scholarships (https://scholarshipamerica.org/students/browse-scholarships/) Resources (https://scholarshipamerica.org/students/resources/) About (https://scholarshipamerica.org/about/) We’re dedicated to removing financial barriers so every student has the opportunity to pursue their dreams. Board & Leaders (https://scholarshipamerica.org/about/board-and-leaders/) Careers (https://scholarshipamerica.org/about/careers/) Reports & Financials (https://scholarshipamerica.org/about/documentation-and-financial-information/) Security Trust Center (https://scholarshipamerica.org/security-trust-center/) Contact (https://scholarshipamerica.org/about/contact/) News & Events (https://scholarshipamerica.org/blog/) Scholarship America is the nation’s leading administrator of scholarship programs, combining best-in-class service with a nonprofit mission to eliminate barriers to higher education. Blog (https://scholarshipamerica.org/blog/) Media (https://scholarshipamerica.org/media/) Webinar Library (https://scholarshipamerica.org/webinar/) Families of Freedom Fund (https://scholarshipamerica.org/families-of-freedom/) A national fund providing postsecondary scholarships to the dependents of those killed or permanently disabled in the September 11 attacks. Families of Freedom Fund (https://scholarshipamerica.org/families-of-freedom/) About (https://scholarshipamerica.org/families-of-freedom/about/) Impact (https://scholarshipamerica.org/families-of-freedom/impact/) Student Success (https://scholarshipamerica.org/families-of-freedom/student-success/) Resources (https://scholarshipamerica.org/families-of-freedom/resources/) Contact (https://scholarshipamerica.org/families-of-freedom/contact/) Browse Scholarships (https://scholarshipamerica.org/students/browse-scholarships/) Home (https://scholarshipamerica.org/) Amazon Future Engineer Scholarship Amazon Future Engineer Scholarship The Amazon Future Engineer Scholarship program is providing high school seniors with an opportunity to upgrade their careers with a scholarship of up to $40,000, plus internship opportunities at Amazon! Applications Currently Closed The program is currently closed. Information for the upcoming cycle is tentative and subject to change. Get reminded when the application is live by clicking “Remind Me”! Remind Me (http://eepurl.com/hTHkov) Status: Closed Jump To Scholarship Background Let’s see if you’re eligible: Questions you might still be wondering. Scholarship Info Award Amount Up to $40,000 Institutions Community or Technical College, Four-Year University State/Territory National Scholarship Support amazonfutureengineer@scholarshipamerica.org (mailto:amazonfutureengineer@scholarshipamerica.org) 507-931-8372 (tel:507-931-8372) Share Sign Up for Scholarship Updates Register below to receive monthly email updates from Scholarship America about current and upcoming scholarship opportunities. Sign Up Here (https://info.scholarshipamerica.org/sign-up-for-scholarship-notifications?_gl=1*1kwtx6g*_gcl_au*MTkwNDIyOTYyNy4xNzU4NTQ5NjY1) Amazon Future Engineer Scholarship Scholarship Background Amazon Future Engineers earn up to $40,000 for college, plus paid internship opportunities at Amazon. The Amazon Future Engineer Scholarship provides high school seniors with opportunities to launch their careers in computer science. Turn your passion for tech into your future. The Amazon Future Engineer Scholarship awards up to a $40,000 to those pursuing higher education in computer science, or other computer science related field of study along with internship opportunities at Amazon. Apply today to become one of the students that earn this amazing win-win opportunity! Let’s see if you’re eligible: You’re planning to pursue a computer science degree in college, here are the majors we accept Planning to pursue a bachelor’s degree in computer science or other computer science related field of study and are planning to attend an accredited 4-year college or university in the United States (or an accredited 2-year college, with the intent to transfer to a 4-year institution). Majors Computer Science Computer Engineering Software Engineering Computer Programming Math (Mathematics; Applied Math) Data Science Electrical Engineering | Transportation Technology Computer Info Systems Computer Info Science Cognitive Science Informatics Information Technologies | You have experience in computer science or experience in tech To qualify, you need to have taken computer science classes in high school or at a college dual program, or currently be enrolled in one. Examples include: AP Computer Science A AP Computer Science Principles Computer Programming Computer Science Principles | IB Computer Science Java Programming PLTW Computer Science Essentials | It’s cool if you have not! You can take a qualifying exam offered by Amazon. You’ve got a financial gap to fill This opportunity is offered to support students with a substantial need for financial assistance. If that hits home, this is for you. You’re a high school senior with a 2.3 cumulative GPA Students need a minimum 2.3 GPA (on a 4.0 scale or equivalent) and a commitment to their studies. Work Eligible in the United States for at least two years This includes United States citizens, United States permanent residents (holders of a Permanent Resident Card), or Employment Authorized to work in the United States. Employment authorization must be valid for at least 2 years. How are recipients chosen? Amazon Future Engineer Scholarship empowers the next generation of tech innovators. As a high school senior, you can launch your tech career with this opportunity. Turn your passion for tech into your future. We use a holistic selection process that considers numerous criteria and materials you provide to choose winners across the nation. This includes things like: How you do in the classroom, primarily based on GPA Real-world experience – Including coding clubs, after- school clubs, self-taught projects, hackathons and related activities Work experience Short answer responses Financial need – Usually based on household income When you submit your application, we’ll look at all these areas to get a full picture of your fit for this scholarship. What docs do I need? See below for a full checklist of required documents. In order to make your application complete, make sure everything is uploaded electronically by the deadline of January 26, 2026 at 3 PM CT. Online Recommendation We’d prefer this to be your computer science teacher if you have one, or a teacher who knows you well Transcript of Grades Transcripts should be from schools you have attended and/or are currently attending. Documents should display student name, school name, grades and credit hours for each course, and term when each course was taken. Most Recently Filed 1040 Include a copy of the first two pages of your household’s most recently filed IRS 1040 form(s) used for the Financial Information Page. If you are being claimed as a dependent on another person’s IRS 1040 tax return, you must submit the first two pages of that particular tax return with the application. Note: Please black out any sensitive data including Social Security Numbers before uploading. Questions you might still be wondering. Award Information How much will recipients be awarded? Award amounts may vary based on financial need. A last dollar calculation will be made and each recipient will be required to provide their financial aid award letter for determination of their award amount. Is this a one-time award or does it renew each year? This award may be renewed up to three years based on good academic standing (typically 2.0 GPA or better) and continued eligibility. What can the scholarship money be used for? This scholarship’s award can be used for education-related expenses associated with your cost of attendance. Application process When is the deadline to apply? Applications must be submitted by January 22, 2026 at 3 PM CT. Your application is not complete unless all required materials are submitted electronically. In order to maintain a fair process, we do not allow extensions or make exceptions for application deadlines. Can I change my application after it’s been submitted? Once you submit your application, you can’t change it. Please review your application responses carefully to ensure they are complete and accurate. If your situation changes in a way that affects your application after it has been submitted, please contact Scholarship America (mailto:AmazonFutureEngineer@ScholarshipAmerica.org). I’m a student with a disability. How can I receive additional assistance? Please contact Scholarship America (mailto:AmazonFutureEngineer@ScholarshipAmerica.org) for assistance with your application. We are here to help you navigate the process in a way that works for you. Related Majors Computer Science Computer Engineering Software Engineering Computer Programming Math (Mathematics; Applied Math) Data Science Electrical Engineering Transportation Technology Computer Info Systems Computer Info Science Cognitive Science Informatics Information Technologies Please contact Scholarship America (mailto:AmazonFutureEngineer@ScholarshipAmerica.org) if you have additional questions Amazon Future Engineer Assessment Why am I being asked to take this assessment? Completion of the Amazon Future Engineer (AFE) assessment is optional, but can be taken as an alternative to the computer science (CS) course requirement. Didn’t take a CS course in high school? No problem! Try out the AFE programming challenge to show us your skills! Do I need to study for this assessment? Not at all! This is assessment is just to gain an understanding of your comprehension of the computer science function. If you would like to try out the format of coding questions in HackerRank before taking the assessment, you’re welcome to practice using the Amazon Practice Assessment (https://hr.gs/afe_2025_practice). What will the assessment include? The assessment includes four sections. To complete your assessment, you must work through the first three sections. The last section (Feedback) is optional. Programming Basics (timed – 15 minutes) Programming Application (timed – 20 minutes) The coding questions in this section can be solved using different, supported programming languages. You can choose your preferred programming language for each question within the platform. Programming Preferences and Background (timed – 5 minutes) Feedback (optional – 5 minutes) How much time do I have to take the assessment? Once you begin the assessment, you have 45 minutes to complete. Each section is individually timed. Once you begin a section, the timer will continue to count down, even if you log-out. If you do log-out or are disconnected, you can access your session using your original link and log-in credentials. Can I retake the assessment? No. Once you submit the assessment you are not able to take it again for the current application period. Will I know if I pass the assessment? No. We are unable to provide feedback on assessment at this time. How can I check if I completed the assessment? You will receive an automated email from HackerRank, our coding platform vendor, after you complete the assessment. I am having technical issues with my assessment, who can I reach out to? For any issues or other questions, please reach out to: amazonfutureengineer@scholarshipamerica.org (mailto:amazonfutureengineer@scholarshipamerica.org) Academic Performance What is considered good academic performance? This scholarship takes academic performance into consideration. However, we know your GPA doesn’t tell the whole story. Here are some things you should know: Using an algorithm, Scholarship America will adjust your GPA appropriately if it’s not based on a 4.0 scale. The same goes for pass/fail scores. For PSEO students, we’ll consider GPA for high school only. If you were homeschooled, your state creates an equivalent of a transcript and GPA. You’ll need that for your application. If you earned your GED, don’t worry — we’ll help you find a workaround. Selection/evaluation process How does financial need factor into the selection process? If you’re eligible for this scholarship, financial need becomes a determining factor in the evaluation process. There isn’t a specific income amount that qualifies or disqualifies you. It’s always dependent on your unique situation. Who decides the recipients? Recipients are exclusively chosen by Scholarship America. To keep a fair process, an officer or employee of Amazon will never be in the selection process. What if I disagree with the selection decisions? Unfortunately, not every student – even when eligible – can be awarded the scholarship. The good news is Scholarship America might have more scholarships that are a good fit for you. Learn more (https://scholarshipamerica.org/students/browse-scholarships/). Browse More Scholarships Scholarship America offers a safe and trusted resource to help you find scholarships and answer important questions along the way. Browse Scholarships (https://scholarshipamerica.org/students/browse-scholarships/) About (https://scholarshipamerica.org/about/) Careers (https://scholarshipamerica.org/about/careers/) Contact (https://scholarshipamerica.org/about/contact/) Set Up a Scholarship (https://scholarshipamerica.org/sponsors/set-up-a-scholarship/) Dollars For Scholars (https://scholarshipamerica.org/sponsors/dollars-for-scholars/) Blog (https://scholarshipamerica.org/blog/) Visit Scholarship America on Facebook (https://www.facebook.com/ScholarshipAmerica/) Visit Scholarship America on X (https://twitter.com/ScholAmerica) Visit Scholarship America on Instagram (https://www.instagram.com/scholamerica/) Visit Scholarship America on LinkedIn (https://www.linkedin.com/company/scholarship-america) Visit Scholarship America on YouTube (https://youtube.com/@ScholarshipAmerica) Minneapolis, Minnesota 7900 International Drive, Suite 660 Minneapolis, MN 55425 (800) 537-4180 (tel:+(800) 537-4180) (507) 931-1682 (tel:+(507) 931-1682) Sign Up for News Scholarship America uses the contact information you provide to us to contact you about our relevant content, products and services. You may unsubscribe from these communications at anytime. For information on our commitment to protecting your privacy, check out our Privacy Policy. © 2026 Scholarship America | All Rights Reserved | EIN: 04-2296967 Privacy Policy (https://scholarshipamerica.org/privacy-policy/) Cookie Policy (https://scholarshipamerica.org/cookie-policy) Terms & Conditions (https://scholarshipamerica.org/terms-and-conditions/) This website uses cookies to improve your experience. By clicking “Accept”, you agree to our Privacy Policy (https://scholarshipamerica.org/privacy-policy/) and Cookie Policy (https://scholarshipamerica.org/cookie-policy/) Reject Accept"
