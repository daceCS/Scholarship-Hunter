arch/search.html) Start Now (https://www.sdccd.edu/start/index.aspx) Website Search:submit search Students (https://www.sdccd.edu/students/index.aspx) Faculty & Staff (https://www.sdccd.edu/faculty-staff/index.aspx) About (https://www.sdccd.edu/about/index.aspx) San Diego Promise (https://www.sdccd.edu/students/student-promise/index.aspx) Immigration Resources (https://www.sdccd.edu/immigration-resources/index.aspx) Mobile menu trigger button Students (https://www.sdccd.edu/students/index.aspx) Faculty & Staff (https://www.sdccd.edu/faculty-staff/index.aspx) About (https://www.sdccd.edu/about/index.aspx) San Diego Promise (https://www.sdccd.edu/students/student-promise/index.aspx) Immigration Resources (https://www.sdccd.edu/immigration-resources/index.aspx) San Diego Promise Home (https://www.sdccd.edu/) Students (https://www.sdccd.edu/students/) San Diego Promise Students San Diego Promise Open/Close menu icon San Diego Promise (https://www.sdccd.edu/students/student-promise/index.aspx) Apply to the Promise (https://www.sdccd.edu/students/student-promise/apply-promise.aspx) Donate to the San Diego Promise (https://www.sdccd.edu/departments/development/donate.aspx) Promise Petitions (https://www.sdccd.edu/students/student-promise/appeals.aspx) On this page: Information for Promise Donors (https://www.sdccd.edu/departments/development/promise/index.aspx)Our Promise For You! Launched in 2016 by the San Diego Community College District, the San Diego Promise program aims to eliminate financial barriers to community college education. Qualified students at San Diego City, Mesa, and Miramar colleges, including those transitioning from the College of Continuing Education, can access a free education. Promise also offers grants for textbooks and supplies to support students in need. The program cultivates a supportive learning community to promote academic success. Funded by the state of California and generous donors, it has grown from serving 186 students to over 3,000 new students each year, ensuring that quality education is accessible to all. San Diego Promise Program Information Nights Join us via Zoom to learn more about the admission requirements and benefits of San Diego Promise Program. Translation services are available in American Sign Language, Spanish, Japanese, Filipino, Somali, and Vietnamese. Fall 2026 (Semester Start: August 24, 2026) Accordion Open Icon RSVP Today! (https://sdccd.event451.sites.451.io/event/1380737) Slide Deck Fall 2026 (https://www.sdccd.edu/docs/StudentServices/2267_sdccd_promise_information_night.pdf) San Diego Promise Program Support Enrollment Fee and Textbook/ Course Materials Support | Enrollment Fees | Eligible students receive up to two years of: free tuition (Per-Unit Fee) and health fees. Enrollment Fee: California residents pay $46 per unit (For lower division courses at San Diego City, Mesa, and Miramar Colleges) Health Fee: $23.00 (Effective Fall 2025) Student Health Fee. San Diego Promise Program will NOT pay San Diego Community College District the Bachelor's Fee Students enrolled in bachelor’s degree classes are charged an additional $84.00 per unit Bachelor’s fee. Book Grant | Eligible students can receive book grants for up to two years. Book grants help cover the cost of textbooks and other educational materials needed for their courses. Dedicated Professionals Focused on Student Success | Promise Counseling Faculty Promise Classified Professionals Promise Project Assistants and Mentors Promise Administrators and Coordinators San Diego Promise Program Eligibility Tracks Track #1 | First Time to Any College StudentAccordion Open Icon Applicants will NOT be admitted into the San Diego Promise Program if they | | Enrolled, earned, attempted, or have ANY postsecondary experience. (POST High School graduation or high school equivalency completion (HiSET, GED)) | Previously earned a degree, completed training, or received a certificate from a postsecondary educational institution. (POST High School graduation or high school equivalency completion (HiSET, GED)) | Previously admitted or enrolled in the San Diego Promise at the San Diego Community College District. Exceptions | *** Exceptions | Students who earned or attempted college credits or received post-secondary awards before high school graduation or high school equivalency completion ARE STILL eligible for the San Diego Promise Program. Track #2 | Returning SDCCD Student who have not enrolled in classes for three main semester (Fall or Spring, including intervening Summer terms)Accordion Open Icon | Students MUST have enrolled in a previous semester or term post-high school graduation or high school equivalency completion at the San Diego Community College District. Applicants will NOT be admitted into the San Diego Promise Program if they | | have enrolled, earned, attempted, or had ANY postsecondary experience in the following terms leading up to enrollment into the San Diego Promise Program. Fall 2026 Admission Accordion Open Icon Summer 2026 Spring 2026 Fall 2025 Summer 2025 Spring 2025 | Previously earned a degree, completed training, or received a certificate from a postsecondary educational institution. (POST High School graduation or high school equivalency completion (HiSET, GED)) | Previously were admitted or enrolled in the San Diego Promise Program at the San Diego Community College District. *** Exceptions | Students who enrolled in courses at the San Diego College of Continuing Education ARE STILL eligible. Track #3 | Current/ Alumni of College of Continuing Education, and Students who identify as LGBTQIA+, Veteran of US Armed Forces, Foster Youth, Undocumented, and Justice Involved (Formally Incarcerated)Accordion Open Icon Student Must Identify As | San Diego College of Continuing Education Alumni or recent Graduate. LGBTQIA+ Lesbian, Gay, Bisexual, Transgender, Queer, Intersex, Asexual, and other. A veteran of the U.S Armed Forces: The term “veteran” means a person who served in the active military, naval, or air service, and who was discharged. (Does not include active-duty military) Undocumented Student: An undocumented student is a foreign national who: (1) entered the United States without inspection or with fraudulent documents; (2) entered legally as a non-immigrant but then violated the terms of his or her status and remained in the United States without authorization; (3) has Deferred Action Childhood Arrival (“DACA”) status or has previously had DACA; or (4) is otherwise currently in the process of legalizing. Justice Involved: Any individual who has at any time served a custody sentence in any adult or juvenile federal, state, or local detention facility; or in any alternative custody program such as home detention. Foster Youth: Be a current or former foster youth in California whose dependency was established or continued by a court of competent jurisdiction, including a tribal court. Applicants will NOT be admitted into the San Diego Promise Program if they | | Previously earned a degree, completed training, or received a certificate from a postsecondary educational institution. (POST High School graduation or high school equivalency completion (HiSET, GED)) ***Exception: San Diego College of Continuing Education Alumni or recent Graduates who earned a foreign degree or certificate ARE STILL eligible. | Students previously admitted or enrolled in the San Diego Promise Program at the San Diego Community College District is NOT eligible. | Students MUST HAVE NOT enrolled, earned, or attempted more than 24 units at ANY postsecondary educational institution, including the San Diego Community College District. San Diego Promise Program Admission Requirements Apply For Admission to City, Mesa, or Miramar College | Have an active application for Admission to San Diego City, Mesa, or Miramar College. Financial Aid Application | Submit a Free Application for Federal Student Aid (FAFSA) or a California Dream Act application (CADAA) and be received by the San Diego Community College District. Fall 2026: 2026-27 Financial Aid application California Resident | Classified as a California Resident by the San Diego Community College District. SDCCD Residency InformationAccordion Open Icon California Education Code requires that all students attending college be given a residency status. Your residency status is derived based on the questions you answered on your college application. Residency requires two components: That you are physically present in the state of California at least one year and a day prior to the start of the semester That you intend to make California your home. SDCCD Residency Information (https://www.sdccd.edu/apply/residency.asp) High School or High School Equivalency Completion | High school diploma or High School equivalency with completion year and received by the San Diego Community College District. 12 Units or Full Time Equivalent for enrolling semester | Students must be enrolled in 12 units for the semester they are enrolling for San Diego Promise or have submitted a: “Disability Support Programs and Services Waiver of Full-Time Status Requirement for Student Success Programs” Petition for: Unit Reduction for Extenuating Circumstances Submit a San Diego Promise Program Request form (https://www.sdccd.edu/students/student-promise/appeals.aspx) San Diego Community College District 3375 Camino Del Rio South San Diego, California 92108 About (https://www.sdccd.edu/about/index.aspx) Contact Us (https://www.sdccd.edu/about/contact.aspx) Faculty and Staff (https://www.sdccd.edu/faculty-staff/index.aspx) Mission & Goals (https://www.sdccd.edu/about/mission-and-goals.aspx) Students (https://www.sdccd.edu/students/index.aspx) Human Resources (https://www.sdccd.edu/departments/human-resources/index.aspx) Board Meeting Agenda (https://sdccd-edu.community.diligentoneplatform.com/portal/) Clery Act (https://www.sdccd.edu/students/titleix/clery-act.aspx) Accessibility Statement (h