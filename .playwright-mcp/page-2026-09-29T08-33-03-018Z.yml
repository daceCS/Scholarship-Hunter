.itemorder.com/shop/home/) Commemorative Joe DiMaggio Postage Stamps (https://www.niaf.org/shop/commemorative-joe-dimaggio-postage-stamps/) Contact Us (https://www.niaf.org/about/contacts/) Log In (https://www.niaf.org/sales-login/) Donate (https://www.niaf.org/donate/) NIAF SCHOLARSHIP PROGRAM Investing in the Success of Future Italian American Leaders Our Mission Thanks to the generosity of the Italian American community, the National Italian American Foundation has awarded over $10,000,000 in scholarships since its founding. NIAF administers nearly 200 scholarships annually, ranging in value from $2,500 to $12,000 to students with a demonstrated interest in the Italian culture studying a wide variety of subjects. Available Scholarships (https://www.niaf.org/programs/available-scholarships/) Eligibility Applicants must… Have an active NIAF Membership. NIAF memberships are valid for one year from the date of registration. (Memberships are non-refundable.) Students may use their parent, guardian or grandparent’s membership. Be enrolled in a US accredited institution of higher education on a full-time basis for the Fall 2027 semester Have a GPA of at least 3.5 out of 4.0 (or the equivalent). (Some scholarships require a lower GPA for eligibility. Students in a pass-fail system are also eligible.) Be a United States Citizen or permanent resident alien. Applicant must demonstrate a commitment to or interest in Italian culture and heritage. BECOME A MEMBER (https://www.niaf.org/membership/become-a-niaf-member/) *NIAF scholarships have additional specific eligibility requirements. Please visit our Available Scholarships page to review all criteria. 2027-2028 Academic Year Application Deadlines The application for the 2026-2027 NIAF scholarship program is now closed, and applicants will be notified of their status via e-mail on May 18, 2026. The application will reopen for the 2027-2028 academic year on December 1, 2026. Application: | March 1, 2027 11:59 p.m. EST | Supporting Documents: | March 1, 2027 11:59 p.m. EST | Decision Notification: | May 3, 2027 5:00 p.m. EDT | How to Apply Become a NIAF Member (https://www.niaf.org/membership/join-niaf-today/) Make a Scholarship Account Complete Application (https://niaf.communityforce.com/Login.aspx) Upload transcript Upload resume Request recommendation letter(s) Upload FASFA SAR NIAF Scholarship Alumni If you or someone you know is a past NIAF scholarship recipient, we are creating an alumni database and need your help! Give us your name, year that you received a NIAF scholarship, location and any other information you would like to share. We look forward to staying in touch! JOIN DATABASE! (https://www.niaf.org/programs/scholarship-alumni-database/) HOME (https://www.niaf.org/) ABOUT (https://www.niaf.org/about/who-we-are/) SUPPORT (https://www.niaf.org/support/charitable-donations/) MEMBERSHIP (https://www.niaf.org/membership/become-a-niaf-member/) PROGRAMS (https://www.niaf.org/programs/scholarships/) CULTURE (https://www.niaf.org/niaf-societa-dante-alighieri-italian-courses/) NEWS & MEDIA (https://www.niaf.org/news-release-archive/) EVENTS (https://www.niaf.org/events/niaf-new-york-gala-2026/) CONTACT (https://www.niaf.org/about/contacts/) MAP & DIRECTIONS (https://www.google.com/maps/place/1860+19th+St+NW,+Washington,+DC+20009/@38.9152088,-77.045907,17z/data=!3m1!4b1!4m5!3m4!1s0x89b7b7c5738911d7:0x6fe736b297be216b!8m2!3d38.9152088!4d-77.0437183) Amb. Peter F. Secchia Headquarters 1275 K St NW Suite 850 Washington, DC 20005 202-387-0600 / information@niaf.org (mailto:information@niaf.org) Federal ID#: 52-1071723 Privacy and Security Policy (https://www.niaf.org/privacy-and-security-policy/) © 2026 National Italian American Foundation. All Rights Reserved. ENG (https://www.niaf.org/programs/scholarships/) ITA (https://www.niaf.org/programmi/programma-di-borse-di-studio-niaf/?lang=it)"
