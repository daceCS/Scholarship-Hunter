          - generic [ref=e642]: "Make sure you… • Do\x1enot send the application directly to the Scholarship Fund. • Send\x1ethe\x1ecompleted\x1eapplication\x1eto\x1eyour\x1eLocal\x1eUnion, System\x1eFederation\x1eor\x1eNational\x1eDivision. • Do\x1enot send any I.R.S. statements or W-2 forms. The Scholarship Fund will not accept these documents. • Do\x1enot send a picture. QUESTIONS AND CORRESPONDENCE Due to the large number of applicants for this program, applicants are encouraged to get help from their high school counselors to complete all the requirements. If an applicant needs additional assistance, please contact the Scholarship Fund at this address: JAMES R. HOFFA MEMORIAL SCHOLARSHIP FUND 25 Louisiana Avenue, NW Washington, DC 20001 Phone: (202) 624-8735 E-Mail: scholarship@teamster.org REGULATIONS GOVERNING USE OF SCHOLARSHIPS Recipients must attend a U.S. college accredited by one of the six Regional Accrediting Commissions of Higher Education associat- ed with the American Council on Education or a Canadian school which has membership in the Association of Universities and Colleges in Canada. Furthermore, recipients must attend an accredited institution that charges tuition. A recipient may not utilize this scholarship while attending a tuition-free institution such as a military academy. If the recipient is unable to attend college due an illness certi- fied by a physician, the scholarship will be held in abeyance for not more that one year. If schooling is interrupted by military service, scholarships will be held in abeyance for not more than two years, unless the military service is of such a nature as to warrant special consideration beyond that time. When returning from military service, the scholarship recipient must notify the Scholarship Fund and apply for readmission within 90 days and return to school within six months thereafter. Scholarships will be renewed on an annual basis. The recipi- ent must maintain an academic average consistent with the schol- arship requirements of the institution attended. The recipients must maintain a B average (3.00 on a 4.00 scale). Each year a check will be made of the Teamster parent/grandparent’s status with their local union. Suspension from\x1eTeamster\x1emembership\x1efor\x1enon-payment\x1eof\x1edues\x1eor\x1efor any\x1eother\x1ereason\x1ewill\x1eresult\x1ein\x1eforfeiture\x1eof\x1ethe\x1escholarship. The scholarship fund was established as a non-profit, stand alone, charitable incorporated organization (501(c)3 identification #52-2206826) which will raise significant money from affiliates and outside sources to award Teamster dependents greater schol- arship opportunities than have been possible in the past. Although children represent less than 25 percent of the population in our countries, they are 100 percent of our future! James R. Hoffa became a Teamster member in 1934 and served as General President for 14 years, and, in recognition of his tireless service to the Union and its members, was honored as General President Emeritus for life. At the November 1999 General Executive Board meeting, General Secretary-Treasurer C. Thomas Keegel presented a resolution to establish the new scholarship fund. The James R. Hoffa Memorial Scholarship Fund 25 Louisiana Ave., NW Washington, D.C. 20001 Phone: (202) 624-8735 E-mail: scholarship@teamster.org Web: www.teamster.org *More winners at www.teamster.org For more information, contact your local Teamsters union office or visit www.teamster.org. For High School Seniors who are Children or Grandchildren of Teamster Members Dream BIG2012-2013ACADEMIC YEAR SCHOLARSHIPS The James R. Hoffa Memorial SCHOLARSHIP FUND I N T E R N AT I O N A L B R OT H E R H O O D O F T E A M S T E R S -- 1 of 2 -- 4 5. A son, daughter or grandchild of a laid-off Teamster member who has been issued an honor- able withdrawal card during the three years pre- ceding the application deadline is eligible to apply to the program. However, if the member has secured employment not covered by a Teamster contract or if during the 12 consecutive months prior to the layoff the member was a full-time elected officer or was suspended from local union membership, the student is not eligible to apply. APPLICATION PROCEDURE Applications are available from all Teamster Local Unions and from the Scholarship Fund. In addition, applications can be downloaded from the Teamster website (www.teamster.org). Applicants\x1eshould\x1ecom- plete\x1ethe\x1eapplication\x1eand\x1eforward\x1eit\x1eto\x1ethe\x1eTeamster parent/grandparent’s\x1eLocal\x1eUnion,\x1eSystem\x1eFederation or\x1eNational\x1eDivision. The Secretary-Treasurer will complete a section of the application and forward it to the Scholarship Fund. The\x1eapplication\x1emust\x1ebe received\x1eby the\x1eScholarship\x1eFund\x1eby\x1eMarch\x1e31,\x1e2012. Any applications that have not been sent from a local union office will be returned to the applicant. APPLICATION REQUIREMENTS 1. The\x1eAcademic\x1eRecord: This section is completed by the applicant’s guidance counselor. Please attach an official copy of the student’s high school transcript bearing the official school seal. It\x1emust\x1ealso\x1econtain the\x1estudent’s\x1erank\x1ein\x1ehis\x1eor\x1eher\x1ehigh\x1eschool\x1eclass.\x1eIf the\x1erank\x1ein\x1eclass\x1eor\x1edecile\x1epercentage\x1ecannot\x1ebe\x1epro- vided,\x1ethen\x1ethe\x1estudent\x1eis\x1erequired\x1eto\x1esubmit\x1ethe scores\x1eof\x1ethe\x1eSAT\x1eII\x1eTests. Home schooled students must submit SAT II test scores. Two of the SAT II Tests are to consist of English Composition and Mathematics Level I or II. The third SAT II Test must be in either history or science. 2. ACT\x1eor\x1eSAT\x1eScores: The applicant must submit the results from at least one of these two tests. In deciding which test to take, the applicant should consult the school he or she plans to attend. The\x1eACT\x1eor\x1eSAT\x1eScores\x1emust\x1ebe\x1eattached\x1eor\x1einclud- ed\x1ein\x1ethe\x1ehigh\x1eschool\x1etranscript. Letters\x1eof\x1eRecommendation: Canadian and Puerto Rìcan applicants must submit 3 Letters of Recommendation (2 academic and 1 personal) instead of SAT or ACT results. program, where they are attending college courses prior to completion of their high school require- ments, must apply the year before they begin full- time college course work. Canadian students may apply during junior or senior matriculation year, but not both. 2. The applicant must be a son, daughter or grand- child of a Teamster member. Financial dependents (i.e., stepchildren and wards) of Teamster mem- bers are eligible if the member contributes in excess of 50% of the applicant’s financial support and if the applicant is a financial dependent of the member for federal income tax purposes. Teamster Parent/Grandparent 1. The applicant’s Teamster parent/grandparent must have been a member in good standing during the 12 consecutive months preceding the application dead- line of March 31, 2012. In addition, the Teamster parent/grandparent must not have been a full-time elected officer during this period. 2. If the applicant’s Teamster parent/grandparent is retired or deceased, he or she must have been a member in good standing for the 12 consecutive months preceding his or her retirement or death. Furthermore, the member must not have been a full-time elected officer during the 12-month peri- od stated above. 3. If the Teamster member has deposited a withdraw- al card during the 12 months preceding the appli- cation deadline, he or she must have been a dues- paying member for 12 consecutive months prior to taking the withdrawal card. During both periods, the member must not have been a full-time elected officer and must have been a member in good standing. In cases of automatic withdrawal, the same rules apply. 4. If the Teamster member has transferred from one Teamster Local to another during the 12 months pre- ceding the application deadline, both memberships will be added together to obtain the required 12- month period. If there is a lapse between member- ships, the procedure outline in Paragraph 3 will apply. The member must not have been a full-time elected officer of either local union and must have been a member in good standing during those 12 months. INTRODUCTION This brochure describes the James R. Hoffa Memorial Scholarship Fund and outlines in detail eligibility requirements and application procedures. One hundred and fifty scholarships will be award- ed this program year. Applicants compete in one of the five geographic regions where the Teamster par- ent’s Local Union is located. Thirty-one of the awards total $10,000 each. These four-year scholarships are disbursed at the rate of $2,500 per year and are renewable annually. One hundred and nineteen of the awards are one- time $1,000 grants. These scholarships are disbursed to the college or university at the beginning of the recipient’s freshman year. Eligibility requirements and application proce- dures are the same for all awards. Recipients are selected by an impartial committee of university admissions and financial aid directors based on academic achievement, SAT/ACT scores, character, potential and financial need. We consider all appli- cants without regard to race, religion, gender, dis- ability, or any other legally protected status. GUIDELINES The Scholarship Fund has established some guide- lines to be used by students when deciding whether or not to apply to this program. Applicants should: 1. Rank\x1ein\x1ethe\x1etop\x1e15\x1epercent\x1eof\x1etheir\x1ehigh\x1e school\x1eclass; 2. Have, or expect to have, excellent SAT or ACT scores; and 3. Demonstrate financial need. Due to the highly competitive nature of the program and the large number of applicants, students should carefully consider these criteria before submitting an application. ELIGIBILITY REQUIREMENTS Students 1. Applicants to the current program must graduate from high school during the 2011-2012 academic year. Students participating in a concurrent enrollment 2 3 THE JAMES R. HOFFA MEMORIAL SCHOLARSHIP FUND 2 0 1 2 – 2 0 1 3 S C H O L A R S H I P G U I D E -- 2 of 2 --"
