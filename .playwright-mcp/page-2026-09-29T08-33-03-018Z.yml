ncluding two in-memoriam scholarships: The Michael Zapoticzny Memorial Scholarship, established in 2002, is named for 18-year-old Michael Zapoticzny, who passed away in 2001, from epilepsy during his freshman year at Rutgers University in New Jersey. His parents Steve and Sue Zapoticzny award up to $6,000 annually to one college undergraduate in Michael’s honor. The Kim Tallian Memorial Scholarship, established in 2024, will award $2,000 annually through 2028 to one college undergraduate. The scholarship honors the late Kim Tallian, PharmD, APh, BCPP, FASHP, FCCP, FCSHP who served on the Epilepsy Foundation of San Diego County’s Board of Director’s and Professional Advisory Board. Kim was a speaker at many epilepsy conferences, teacher and school nurse trainings and Camp Quest. Priority consideration will be given to a student pursuing a major in bioscience or life science. Eligibility Scholarship applicants must reside in or be permanent residents of San Diego County, Imperial County, or Southern Riverside County. Students from these areas may attend school elsewhere, and out-of-state students currently enrolled in a San Diego school are also eligible. Scholarship applicants must also meet one of the following criteria: 1. Students currently being treated for epilepsy that are currently enrolled or will be enrolled in a college, university or trade school in the fall of 2026. Applicants must provide a letter from their doctor verifying that they are currently being treated for epilepsy/seizure disorder. Applicants must also show satisfactory academic performance and demonstrate financial need. (The criteria for “satisfactory academic performance” does not necessarily mean high GPA. It will be considered according to the capabilities of the student given any learning disabilities, medication side effects, etc.). OR 2. Full-time college or university students involved in epilepsy research projects in the fields of health or social science. Applicants must provide a letter from their professor documenting project details. Students must also have a GPA of at least 3.0 for all work completed and demonstrate financial need. The following documents must be included in the application package: Completed scholarship application Community Service and Volunteer Experience/Academic Achievements Statement of Eligibility Statement of Financial Need Current Transcript (official or unofficial) verifying enrollment and GPA Letter from your doctor stating you are currently being treated for epilepsy OR letter from your professor stating you are currently working on an epilepsy research project (please include project details) Two Letters of Recommendation For more information, please contact us at 619.296.0161 (tel:6192960161) or email programs@epilepsysandiego.org (https://www.epilepsysandiego.org/college-scholarships/programs@epilepsysandiego.org). 2026-27 Academic Year Scholarships Congratulations to college students Matthew Henderson, Elliana Haines, Raygan Carroll, Claire Villaescuza, Mya Alexander, Lucy Shields and Richie Guerra—this year’s recipients of college scholarships offered by the Epilepsy Foundation of San Diego County! Thank you to everyone who applied, and to the Zapoticzny family, the Tallian/Lee family, and our generous community who continue to make these scholarships possible. Scholarship Reception Photos (https://flic.kr/s/aHBqjD1HXQ) Get to Know Our 2026-27 College Scholarship Recipients (https://www.epilepsysandiego.org/wp-content/uploads/2026/08/Epilepsy-San-Diego-scholarship-recipients-2026-2027.pdf) Coming in 2027: 2027-28 Scholarship Program Information Coming in 2027: 2027-28 College Scholarship Application Keep up to date with the Epilepsy Foundation of San Diego Camping with the Epilepsy Foundation of San Diego County (https://www.epilepsysandiego.org/camping-with-epilepsy-foundation-of-san-diego-county/) Epilepsy Foundation of San Diego County on Transportation Access and Innovation (https://www.epilepsysandiego.org/epilepsy-foundation-of-san-diego-county-on-transportation-access-and-innovation/) SUDEP Community Conversation: Bringing Awareness with Compassion (https://www.epilepsysandiego.org/sudep-community-conversation-bringing-awareness-with-compassion/) The Epilepsy Foundation of San Diego County is a 501(c)(3) non-profit organization serving the San Diego community since 1954. Legal Terms (https://www.epilepsysandiego.org/terms-conditions/) Privacy Policy (https://www.epilepsysandiego.org/privacy-policy-2/) Disclaimer (https://www.epilepsysandiego.org/disclaimer/) Terms (https://www.epilepsysandiego.org/terms-conditions/) Privacy Policy (https://www.epilepsysandiego.org/privacy-policy-2/) Disclaimer (https://www.epilepsysandiego.org/disclaimer/) Quick Links Make an Impact (https://www.epilepsysandiego.org/donate/) Programs (https://www.epilepsysandiego.org/epilepsy-programs/) Resources (https://www.epilepsysandiego.org/news/) Events (https://www.epilepsysandiego.org/upcoming-events/) En Español (https://www.epilepsysandiego.org/servicios-y-programas-de-apoyo-en-espanol/) Make an Impact (https://www.epilepsysandiego.org/donate/) Programs (https://www.epilepsysandiego.org/epilepsy-programs/) Resources (https://www.epilepsysandiego.org/news/) Events (https://www.epilepsysandiego.org/upcoming-events/) En Español (https://www.epilepsysandiego.org/servicios-y-programas-de-apoyo-en-espanol/) About Us Our Mission (https://www.epilepsysandiego.org/about-us/) FAQ (https://www.epilepsysandiego.org/faq/) Blog (https://www.epilepsysandiego.org/news/) Contact (https://www.epilepsysandiego.org/contact-us/) Contacto (https://www.epilepsysandiego.org/contactenos/) Our Mission (https://www.epilepsysandiego.org/about-us/) FAQ (https://www.epilepsysandiego.org/faq/) Blog (https://www.epilepsysandiego.org/news/) Contact (https://www.epilepsysandiego.org/contact-us/) Contacto (https://www.epilepsysandiego.org/contactenos/) Donate Now (https://www.epilepsysandiego.org/donate) Sign up for 