and supporters. Your gift provides inspiring Boys & Girls Club teens access to pursue their dreams to attend college and become young leaders who will shape our world. DONATE TODAY (https://www.bgca.org/get-involved/join-alumni-friends?form=Alumni) YOUR IMPACT Natalia Lynch 2014 National Military Youth of the Year “Because of this scholarship, I not only attended Vanderbilt University. I also graduated debt free. The entire trajectory of my education and career would have been altered without it. I am extremely thankful for the scholarship and the doors it opened for me. I’m proud to say I graduated from the “Ivy League of the South” in 2018 with a double major in Communication Studies and German and a minor in Corporate Strategy.” Meeri Shin 2013 Southeast Youth of the Year “The scholarship provided me with incredible financial freedom I wouldn’t have had without it. It covered all secondary and hidden costs such as a laptop, textbooks and summer opportunities that really allowed me to thrive and stand apart from my peers. I was able to focus on academics and take up extracurricular activities I wouldn’t have been able to participate in otherwise. I’m proud to have graduated from the University of California at Berkeley in 2017 with a double major in Political Economics and Media Studies.” Find a Club Near You ZIP Find a Club About Us (https://www.bgca.org/about-us) Careers (https://www.bgca.org/about-us/careers/) Our Mission (https://www.bgca.org/about-us/our-mission-story/) Find a Club (https://www.bgca.org/get-involved/find-a-club/) Contact Us (https://www.bgca.org/about-us/contact-us/) Vendor Opportunities (https://www.bgca.org/vendor-opportunities/) Get Involved (https://www.bgca.org/get-involved) Alumni (https://www.bgca.org/get-involved/join-alumni-friends/) Partners (https://www.bgca.org/about-us/our-partners/) Programs (https://www.bgca.org/programs/) Ways to Give (https://www.bgca.org/ways-to-give/) Resources Child Safety (https://www.bgca.org/about-us/ch