) More Education Associate Degrees (https://www.unionplus.org/benefits/education/associate-degrees) Bachelor's Degrees (https://www.unionplus.org/benefits/education/bachelors-degrees) Graduate Degrees (https://www.unionplus.org/benefits/education/graduate-degrees) Certificates (https://www.unionplus.org/benefits/education/certificates) Scholarships (https://www.unionplus.org/benefits/education/union-plus-scholarships) More Union Plus Scholarships A scholarship for union families Union Plus Scholarships help union families with the cost of college. Apply for the 2027 Scholarship (https://apply.mykaleidoscope.com/program/UnionPlusScholarship2027) Application deadline: January 31, 2027 Over $6.2 million in scholarships awarded to union families Since 1991, the Union Plus Scholarship Program has awarded more than $6.2 million to students of working families who want to begin or continue their post-secondary education. More than 4,400 families have benefited from our commitment to higher education. The Union Plus Scholarship Program is offered through the Union Plus Education Foundation, supported in part by contributions from the provider of the Union Plus Credit Card (https://www.unionplus.org/benefits/money/union-plus-credit-card), the provider of the Union Plus Personal Loan (https://www.unionplus.org/benefits/money/personal-loan), and providers of the Union Plus College Program (https://www.unionplus.org/benefits/education). (You do not need to participate in these programs to apply for this scholarship.) Meet the latest scholarship recipients The Union Plus Scholarship awards are presented annually to union members or members of their families who want to begin or continue their post-secondary education. In 2026, 181 union members and union family members were awarded $300,000 in Union Plus Scholarships. 2026 scholarship winners (https://www.unionplus.org/2026UPScholarshipWinnters) How the Union Plus Scholarship Program works Eligibility Current and retired members of participating unions, their spouses and their dependent children (as defined by IRS regulations). At least one year of continuous union membership by the applicant, applicant's spouse or parent (if applicant is a dependent). The one-year membership minimum must be satisfied by May 31 of the scholarship year. See more details on eligibility in the tab below. Evaluation Criteria This is a competitive scholarship. Applicants are evaluated according to academic ability, social awareness, financial need and appreciation of labor. A GPA of 3.0 or higher is recommended. The required essays can account for up to half your total score. Scholarship applicants are judged by a committee of impartial post-secondary educators. Application Timeline Applications are available starting in mid-June, and a complete application must be received on or before 11:59 p.m. Eastern Standard Time on January 31 of the scholarship year. Applications received after this deadline will not be considered. Scholarship Award Amounts Amounts range from $1,000 to $4,000. These one-time cash awards are for study beginning in the fall of the awarded year. Students may re-apply each year. VAL COLE Award - NEW IN 2026 This year, we are dedicating a special Union Plus scholarship award in honor of our colleague Valerie “Val” Cole. Val devoted her life to the service of union members and their families. She had a special connection to all labor unions, especially her brothers and sisters in the trade unions. This award honors Val’s legacy, her lively spirit, and her passion for service. A $2,500 scholarship has been awarded to Ainsley Orr, the daughter of a BMWED-IBT member. Isaiah's Award Isaiah's Award was created to honor the exceptional life of Isaiah C., a beloved child, fostered and adopted by a current, long-time employee of Union Plus. Isaiah was a smart, talented, spiritual, generous and kind young man. It is our wish that his gentle spirit live on, in part, through this namesake scholarship. Applicants for Isaiah's Award must have a special connection to the foster care system, and will be asked in their application to describe their personal, employment, volunteer experiences, or career goals related to the foster care system. Award Date The Scholarship Committee will determine recipients of scholarship awards by May 31 each year. During the first week of June award recipients will be individually notified by mail, and all applicants will be sent an email with notification that the award list is posted. Please note that due to the volume of applications we cannot provide any information on the status of an application before award announcements are made. Outstanding Scholarship Recipients The students selected for university, college, trade or technical school scholarships represent a wide sampling of backgrounds, union affiliations, goals and accomplishments. The selection process is very competitive since we receive over thousands of applications each year. The Union Plus Education Foundation The Union Plus Education Foundation has awarded more than $6.2 million in scholarships to students of union families. Over 4,400 union families have benefited from our commitment to higher education. With the help of donations from union supporters, the Foundation can help even more union families attain their education goals. Learn more about the Union Plus Education Foundation (https://www.unionplus.org/page/union-plus-education-foundation). FAQ Your questions, answered. What is the deadline to apply? Your application must be complete and received by 11:59 p.m. EST, January 31, 2027. Who is eligible to apply? Current and retired members of unions that participate in any Union Plus program, their spouses and their dependent children (as defined by IRS regulations) can apply for a Union Plus Scholarship. Grandchildren are not eligible unless a legal dependent (as defined by IRS regulations). At least one year of continuous union membership by the applicant, applicant's spouse or parent (if applicant is a dependent). TThe one year membership minimum must be satisfied by May 31, 2027. I am not sure if my union is eligible, how can I check? A list of eligible unions is provided in a drop-down menu in the Union Information section of the scholarship application. You might also ask your local union representative or visit your local or national union’s website to check if they offer Union Plus benefits. Also, a list of eligible unions is available in the drop-down menu when you create an account on the Union Plus (https://www.unionplus.org/) website. Do I have to participate in a Union Plus program to be eligible? No, you do not have to purchase any Union Plus product or participate in any Union Plus program to be eligible. What years of study are covered? The scholarship applies to any year of study, from the freshman year of college through the last year of graduate school, including law school and medical school. The applicant must be accepted into a U.S. accredited post-secondary school at the time the award is issued. What types of schools are covered? U.S. accredited colleges and universities, including undergraduate and graduate schools, community colleges, trade and technical schools. Are there geographic restrictions? Union members (and family members) from the U.S., Puerto Rico, Guam, the U.S. Virgin Islands and Canada are eligible. Awards apply only to those attending a U.S. accredited college, university, trade or technical school. What do I need to include to complete the scholarship application? Information and requirements include: One letter of reference from a teacher or other adult who is familiar with your achievements and abilities. We encourage applicants to obtain and submit their letter of reference on their own. However, if your reference requires that the letter remain confidential, you have an option to nominate your reference so the letter may be submitted confidentially. (The application will request that you to send an email to your reference, who will be instructed on how to confidentially attach their letter.) The letter must be in Word (.doc/.docx); Adobe (.pdf); JPEG (.jpeg, .jpg); PNG (.png). Two required essays of approximately 350 words each.Essay 1: Describe your relationship with the union and the labor movement, in what ways has it personally affected your life and your family's life? Essay 2: A choice of one of these two questions: A) The lessons we take from obstacles we encounter can be fundamental to later success. Recount a time when you faced a challenge, setback, or failure. How did it affect you, and what did you learn from the experience? B) Reflect on something that someone has done for you that has made you happy or thankful in a surprising way. How has this gratitude affected or motivated you? Union information. National or international union name, local union number, local union's address, phone number and the name of the local union President or Business Manager. You need this information for your union, your spouse's union or your parent's union (if you are a dependent). If you or your family members are affiliated with multiple unions you must list this information for all. I am not a union member and I don’t know how to answer the essay question. Submit an essay of approximately 350 words describing your relationship with the union and the labor movement. In what ways has it personally affected your life and your family’s life? Refer to the following advice listed in the Essay section: Because this is a union scholarship, we are looking for your own knowledge of unions and the labor movement. Although it may be included, please do not simply recite typical labor history. Write about personal stories and experiences. Many applicants may not be union members but are the children or spouses of union members. Talk with union family members (parents, spouses, grandparents, etc.) and ask them about their experiences in the union. Relate personal stories and experiences on how being in a union has made a difference in their life and your life. Do you have hard copies of this application? No, you can only apply for the Union Plus Scholarship using this online form. My teacher/reference needs the letter of reference to be submitted confidentially, how can I do this? In the application’s Reference Letter section there is detailed explanation of how to nominate a third party to submit the letter of reference confidentially. What is the scholarship award evaluation criteria? This is a competitive scholarship, and applicants are evaluated according to academic ability, social awareness, financial need and appreciation of labor. A GPA of 3.0 or higher is recommended. Applicants are evaluated according to academic ability, social awareness, financial need and appreciation of labor. The required essays can account for up to half your total score. Scholarship applicants are judged by a committee of impartial post-secondary educators. What time period does the award cover? Awards are issued in June of 2027 and apply to the 2027 - 2028 school year. The applicant must be accepted into an accredited college or university, community college or recognized technical or trade school at the time the award is issued. What are the scholarship award amounts? Amounts range from $1,000 to $4,000. These one-time cash awards are for study beginning in the fall the year the award is made. Students may re-apply each year. Is the scholarship renewable? No, these are one-time awards. But each year you may re-apply and you might be selected to receive another award. Will I be notified about the status of my application? When you successfully submit your application you'll get a screen message confirming your application was received. Due to the volume of applications, we cannot provide any information on the status of an application before the award announcements are made during the first week of June each year. All applicants will be notified by email when the award list is posted at the Union Plus website by mid-June. When and how are the scholarship awards announced? Awards are announced by mail the first week of June each year. Award recipients who do not respond are then contacted by phone. All applicants will be notified by email when the award list is posted at unionplus.org/scholarships by mid-June each year. Please note that due to the volume of applications we cannot provide any information on the status of an application before award announcements are made. Who offers the Union Plus Scholarship? The Union Plus Scholarship is offered by the Union Plus Education Foundation, with funding from Capital One N.A. (the provider of the Union Plus Credit Card), First National Bank of Omaha (the provider of the Union Plus Personal Loan), EDVANCE (a provider of the Union Plus College Program), and Western Governors University (a provider of the Union Plus College Program). (Note, you do not need to participate in these programs to be eligible to apply for this scholarship). Need help? If you have questions about the Union Plus Scholarship program, send an email to scholarships@unionplus.org (mailto:scholarships@unionplus.org) If you have started an application, be sure to check the FAQ button in the dashboard of your application. If you are having trouble logging into your Scholarship application, click on the Forgot Password link on the Scholarship website's login page (https://1unionplusscholars.communityforce.com/login.aspx) to reset your password. Look what people are saying In the past year, I have truly come to appreciate the power of collective bargaining and the incredible force of the labor movement, and I will never forget the influence it has had on my family. Claire H. Child of IBEW Local 816 Member What I’m so impressed by is the fact that Union Plus is providing benefits for and actually caring about hard-working Americans. Meesha T. AFT Member More helpful benefits College Program (https://www.unionplus.org/benefits/education/college-program) Union family members can earn an affordable, online bachelor’s degree. Student Debt Navigator (https://www.unionplus.org/benefits/money/student-debt-navigator) Learn how to optimize your student loans, reduce your repayment plan and see if you qualify for loan forgiveness programs. Personal Loan (https://www.unionplus.org/benefits/money/personal-loan) A personal loan gives you fast and convenient access to the money you need now. To receive mobile text alerts about education-related deadlines and information, text STUDENT to 22555* *Msg&Data Rates May Apply. Reply STOP to opt-out. We'll txt you approx. 1x/mo. Terms & Conditions/Privacy Policy (http://help.mcommons.com/s/22555). Reply HELP or contact help@unionplus.org for help. About Us (https://www.unionplus.org/page/about-us) Help (https://www.unionplus.org/page/help) For Leaders (https://www.unionplus.org/page/leaders) Hardship Help (https://www.unionplus.org/benefits/hardship-help) Facebook (https://www.facebook.com/unionplus) Instagram (https://www.instagram.com/unionplus/) Twitter (https://twitter.com/unionplus) YouTube (https://www.youtube.com/user/UnionPlusBenefits) Money (https://www.unionplus.org/benefits/money) Credit Card (https://www.unionplus.org/benefits/money/union-plus-credit-card) IDProtection Plus (https://www.unionplus.org/idprotection) Legal Program (https://www.unionplus.org/benefits/home/legal-help) Debt Settlement (https://www.unionplus.org/benefits/money/debt-settlement) Personal Loan (https://www.unionplus.org/benefits/money/personal-loan) Student Debt Navigator (https://www.unionplus.org/benefits/money/student-debt-navigator) Home & Auto (https://www.unionplus.org/benefits/home-auto) Auto Buying (https://www.unionplus.org/benefits/home-auto/auto-buying) Mortgage Program (https://www.unionplus.org/benefits/home-auto/wells-fargo-mortgage-program) Real Estate Rewards (https://www.unionplus.org/benefits/home-auto/real-estate-rewa