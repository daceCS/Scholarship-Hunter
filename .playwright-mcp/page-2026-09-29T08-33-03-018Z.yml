          - generic [ref=e138]: Who We Are Events (https://www.burgerkingfoundation.org/events) About Us Who We Are (https://www.burgerkingfoundation.org/about/who-we-are) Annual Report (https://cdn.prod.website-files.com/6398c2fc5d7f846efc27bc6c/69baaf5a512f9a950d1c76bf_2025%20Annual%20Report%20PDF.pdf%20(7)compresscompress2.pdf) Supporters (https://www.burgerkingfoundation.org/about/supporters) Alumni (https://www.burgerkingfoundation.org/about/alumni) Contact Us (https://www.burgerkingfoundation.org/about/contact-us) Programs Scholars Program (https://www.burgerkingfoundation.org/programs/burger-king-sm-scholars) Emergency Relief (https://www.burgerkingfoundation.org/programs/emergency-relief) Crown A Classroom (https://www.burgerkingfoundation.org/programs/crown-a-classroom) Global Impact (https://www.burgerkingfoundation.org/programs/Global-Impact) Program Participation (https://www.burgerkingfoundation.org/programs/franchise-program-participation) Donate now (https://www.burgerkingfoundation.org/donate) Who We Are The Burger King Foundation believes in empowerment through education and lending a helping hand, when needed, thus allowing you to live life your way. To this end, we supply emergency relief to our employees and provide essential resources to help the students of today and the scholars of tomorrow discover their full potential. Our story started with Burger King co-founder James “Jim” W. McLamore’s philosophy of giving back to his community and the institutions that helped develop him along the way. His unwavering dedication to bettering the lives of those around him inspired the creation of the BK℠ Scholars Program in 2000 by a group of franchisees. In 2011, the McLamore Family added a new category to the BK Scholars program to help make an even greater impact. The James W. McLamore WHOPPER® Scholarship Award was created, allowing the Foundation to grant three $60,000 awards to deserving students each year. In addition to granting scholarships, the BK℠ Emergency Fund, established in 2004, provides a helping hand during times of need to Burger King team members and their families. This program assists BK® employees with short-term, immediate assistance in situations such as medical illnesses, natural disasters, rebuilding after house fires and other emergencies. Expanding on Jim’s vision, drive and commitment for helping others, both programs came together under the creation of what is now known as the Burger King Foundation in 2005. With the continued support of our loyal franchisees, vendor partners, restaurant guests, and the BK Scholars alumni, the Burger King Foundation continues to honor Jim and his passion for education. His legacy will live on through the students and BK team members touched by the Foundation. Our Board of Directors Chris Johnson President, Rackson Restaurants Corp. Dan Fitzpatrick Chairman & Chief Executive Officer, Quality Dining, Inc., Burger King Foundation Co-Chairman Eileen Begley Director, Marketing, BK Company Restaurant Gary Moore CEO, HB Boys L.C. Isabel Turull Chief Executive Officer, Burger King Dominican Republic Joel Yashinsky Chief Marketing Officer, BK, US&C Luke Pisors Chief Executive Officer, Ambrosia QSR Marc Aust Vice President, Operations Services, BK, US&C Nicolas Henrich Chief Operating Officer, BK, US& Rachel Levins Partner, The Phoenix Organization Raj Varman Chief Executive Officer, Burger King India Richard Santowski Kollhorst Foods LLC Robes St. Juste Chief Executive Officer, St. Juste Management Corp. Thibault Roux Chief Digital Officer, BK, US&C Tom Curtis President, BK, US&C, Burger King Foundation Co-Chairman Tom McDonald President, Glencoe Management Our Management Team Tom Curtis President Katie Lewis Executive Director Ana Gonzalez Finance & Accounting Britni Garcia In-Restaurant Fundraising Mercedes Garcia Finance Carlye Cowheard Event Fundraising Vanina Zack Programs Trini Miguel Community and Employee Engagement Sheila Martinez Operations Our Officers Jackie Friesner Board of Directors Officer, Treasurer Robin Schafer Board of Directors Officer, Secretary Key Policies (https://www.burgerkingfoundation.org/footnote/key-policies)| Legal Info (https://www.burgerkingfoundation.org/footnote/legal-info)| Privacy Policy (https://www.burgerkingfoundation.org/footnote/privacy-policy) | Annual Report (https://cdn.prod.website-files.com/6398c2fd5d7f8405fb27bc74/69baa4bfda0282f87d4cbe53_2025%20Annual%20Report%20PDF.pdf%20(7)compresscompress2.pdf) | Form 990 (https://cdn.prod.website-files.com/6398c2fd5d7f8405fb27bc74/6a8efa0678019addc4d17946_2025%20990%20BURGER%20KING%20FOUNDATION%20INC_TaxReturn_Public_US.pdf) | Financials (https://cdn.prod.website-files.com/6398c2fd5d7f8405fb27bc74/6a7c8e243bdbbba656060878_12-31-2025%20Burger%20King%20Foundation%20Audited%20Financial%20Statements.pdf) TM & © 2025 Burger King Company LLC. All rights reserved.
