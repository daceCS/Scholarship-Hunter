du/ca4h-resourcecenter/projects/healthy-living/4th-h-for-health) Leadership (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/leadership) Outdoor Activities (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/outdoor-activities) Personal Growth & Career (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/personal-growth-career) Shooting Sports (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/shooting-sports) STEAM (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/steam) Science (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/steam/science) Technology (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/steam/technology) Engineering (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/steam/engineering) Agriculture (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/projects/steam/agriculture) Programs (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/programs) Camp (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/programs/camp) Clubs (https://sites.google.com/ucdavis.edu/ca4h-resourcecenter/programs/clubs) Scholarships The University of California 4-H Youth Development Program supports continuing education after high school. If you are - or were - a California 4-H member when you received your high school diploma, you may qualify to apply for 4-H Higher Education scholarships to continue your education at accredited vocational schools, colleges, or universities. Other scholarship opportunities are listed below the 4-H scholarship information. 4-H Higher Education Scholarships Dean Memorial Legacy Scholarship Award: $1,000 scholarship Number awarded: At least 3 (depending on funding) Award shall be given to a student pursuing any field of scholastic endeavor. Candidates are judged on how 4-H has influenced their future plans, their involvement with leadership and civic engagement experiences, and demonstrating a level of skill and knowledge in any project area. Please see the Essay Prompts (https://ucdavis.box.com/s/kdb74zp135mzb2quu6zsck9u9p2793e6) (PDF, 139.5 KB) for this scholarship. About the Dean Memorial Legacy Scholarship For nearly 40 years, Bob and Pat Dean were passionately devoted to the 4-H Youth Development Program and the California 4-H Foundation. Without children of their own, Bob and Pat considered the 4-H youth their children. Through this scholarship fund, they have insured the future of their family. Samarin Family Vocational Scholarship Award: $1000 scholarship Number awarded: One annually Candidates must be enrolled in, or intending to enroll in (upon high school graduation), a vocational/trade school or junior college vocational training program in the United States. Note: Vocational education is organized educational programs that are directly related to the preparation of individuals for employment or for additional preparation for a career requiring other than a baccalaureate or advanced degree. Examples include automotive technician, welder, forester, drafter, dental assistant, medical assistant, pharmacy technician, and other vocational fields. Consideration will be given first to those students who, in the absence of a scholarship, might otherwise be unable to attend a vocational or trade school, or junior college vocational training program. All applicants in need of encouragement and support in pursuing a vocational program will be considered. Applications will be judged on financial need and how the scholarship will help the candidate reach their vocational education goals. These are evaluated based on the applicant's essay. Please see the Essay Prompts (https://ucdavis.box.com/s/kdb74zp135mzb2quu6zsck9u9p2793e6) (PDF, 139.5 KB) for this scholarship. Ehn Family Scholarship Award: $2000 scholarship Number awarded: 1 The Ehn Family Scholarship shall be given to students pursuing agricultural engineering, or related field at a post-secondary accredited college or university. This scholarship’s focus is for those pursuing the use of technology to enhance agricultural practices or solve agricultural problems. Consideration will be given to those students who were 4-H members in Fresno County, and open to all California 4-H alumni from any geographic area. Please see the Essay Prompts (https://ucdavis.box.com/s/kdb74zp135mzb2quu6zsck9u9p2793e6) (PDF, 139.5 KB) for this scholarship. Kaye Suddath Memorial Scholarship Award: $2000 scholarship Number awarded: 1 The Kaye Suddath Memorial Scholarship shall be given to students pursuing a degree focused on agriculture at a post-secondary accredited college or university. This scholarship is open to all California 4-H alumni from any geographic area. Please see the Essay Prompts (https://ucdavis.box.com/s/kdb74zp135mzb2quu6zsck9u9p2793e6) (PDF, 139.5 KB) for this scholarship. If you are interested in starting a 4-H scholarship fund, please contact the California 4-H Foundation (https://ucanr.edu/sites/4hfoundation/). 4-H Higher Education Scholarship Applications 2026 Scholarship Applications are open (https://docs.google.com/forms/d/e/1FAIpQLSfMbfRFrDWqz1JO7MONcKp6EQQzUs-EyWf5TVYPHieAVAHtzQ/viewform?usp=header)Deadline to Apply: October 25, 2026, 11:59 pm Please read the information below before starting your online application. You will not be able to save your place and return, you will have to start over. Qualifications for 4-H Higher Education Scholarships A high school graduate or equivalent who can show proof of enrollment in an institution of higher education, including an accredited vocational school, college, or university. Enrolled in the University of California 4-H Youth Development Program at the time of high school graduation or equivalent, such as receiving a General Education Diploma (GED) You must be enrolled or planning to enroll in at least half of the full-time course load as defined by your school. You are no older than 25 as of December 31st of the application year. You may apply for multiple scholarships but are only eligible to receive one yearly scholarship. Previous scholarship recipients may reapply. 4-H Higher Education Scholarship Application Requirements Complete all information on the application survey and submit one time only. You will not be able to save your progress and return later. Include a link to a folder with all of your attachments. All documents must be in a PDF format. Save PDF versions of your attached documents into a folder on a cloud drive (Google is preferred, and platforms such as Box or Dropbox also work). Ensure the link for the folder is set to “anyone with the link can access”. NOTE: Double-check your document links to make sure they work. We will not evaluate inaccessible documents. Attachments include: Essays – application essay plus essays for individual scholarships. Please see Essay Prompts (https://ucdavis.box.com/s/kdb74zp135mzb2quu6zsck9u9p2793e6) (PDF, 139.5 KB) for format and subject requirements. 4-H Resume Unofficial transcript from higher education institution or verification of enrollment for the upcoming year (acceptance letters are not sufficient). Applications that do not include all the above listed items will not be evaluated. Submitted materials become the property of the California State 4-H Office and may be used for marketing and public relations purposes. 4-H Higher Education Scholarship Award Notifications Late October – notifications sent January - award money distributed* This is the general timeline, and these dates are subject to change. * Award recipients must submit a photograph, a completed W-9 form and a thank-you letter to the donor before receiving the check. Award recipients are responsible for reporting funds received as income if they are not used for qualified educational expenses. Other Scholarship Opportunities The following scholarships may be of interest to 4-H seniors and alumni. Please note that each scholarship has its own deadlines and requirements. Pembroke Welsh Corgi Club of America scholarship The Pembroke Welsh Corgi Club of America’s Scholarship Program is established to recognize young people that are actively involved in the sport of dogs, with emphasis on Pembroke Welsh Corgis. The PWCCA will award up to $2,000 to one or more qualified students currently enrolled or who plan to be enrolled in an institute of higher education. This includes high school seniors, high school graduates, and those already enrolled in higher education. Learn more about the PWCCA Scholarship (https://pwcca.org/PWCCA-Scholarships). Dellavalle Soil Science Scholarship The purpose of the Dellavalle Scholarship is to encourage high school students to pursue careers in soil science. A $5,000 scholarship will be awarded to a California high school senior who plans to pursue a degree in a soil-science related field. Learn more about the Dellavalle Soil Science Scholarship (https://www.soils.org/awards/view/213/). Questions? Please contact Gemma Miner at gmminer@ucanr.edu (mailto:gmminer@ucanr.edu). © 2026 University of California 4-H Youth Development Program. All rights reserved. 2801 Second Street, Davis, CA 95618 (530) 750-1334 ca4h@ucanr.edu (mailto:ca4h@ucanr.edu)NonDiscrimination Statement (https://ucanr.edu/sites/anrstaff/Diversity/Affirmative_Action/Resources/Policy-related_downloads/) Report abuse Report abuse"
